<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilotage — Renouvellement ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --canvas:#E9EDF1;
  --surface:#FFFFFF;
  --surface-2:#F5F7F9;
  --line:#D3DBE3;
  --line-soft:#E5EAEF;
  --ink:#101923;
  --ink-2:#465667;
  --ink-3:#7C8B9B;
  --accent:#2547C8;
  --accent-soft:#E7EBFB;
  --signal:#E8A33D;
  --alert:#C6382F;
  --ok:#0F8A5F;
  --rail:#111B26;

  --p1:#3C63E0; --p2:#0E9488; --p3:#6B3FD4; --p4:#DB6B12; --p5:#0E86AD; --p6:#6B7785;

  --r:4px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --row-h:32px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font-family:var(--sans);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:212px 1fr;height:100vh;overflow:hidden}

.rail{background:var(--rail);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.rail__brand{padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.rail__eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#7E8FA3}
.rail__title{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.01em;margin-top:3px;line-height:1.15}
.rail__nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:#B4C1CF;
  padding:8px 9px;border-radius:var(--r);cursor:pointer;transition:background .12s,color .12s}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff}
.navitem.is-active{background:var(--accent);color:#fff}
.navitem svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.navitem span{font-size:12.5px}
.rail__foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.1);font-family:var(--mono);font-size:10px;color:#6E7F92;display:flex;flex-direction:column;gap:6px}
.rail__foot button{background:none;border:1px solid rgba(255,255,255,.18);color:#B4C1CF;padding:5px 8px;border-radius:var(--r);cursor:pointer;font-size:10.5px;font-family:var(--mono)}
.rail__foot button:hover{border-color:#fff;color:#fff}

.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.topbar h1{font-family:var(--cond);font-size:19px;font-weight:600;margin:0;letter-spacing:.005em}
.topbar__sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.topbar__tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.view{flex:1;overflow:auto;padding:18px 20px 40px}
.view.view--flush{padding:0;display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none!important}

/* ============ CONTROLS ============ */
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 11px;cursor:pointer;font-size:12px;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn--primary:hover{background:#1c39a8;border-color:#1c39a8}
.btn--ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:4px 7px}
.btn--ghost:hover{background:var(--surface-2);border-color:var(--line-soft)}
.btn--danger{color:var(--alert);border-color:#EBC7C4}
.btn--danger:hover{background:#FBEEED;border-color:var(--alert)}
.btn--sm{padding:3px 8px;font-size:11.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:5px 11px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.is-active{background:var(--ink);color:#fff}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;width:100%;font-size:12.5px}
input:disabled{background:var(--surface-2);color:var(--ink-3)}
textarea{resize:vertical;min-height:56px;font-family:inherit}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}

/* ============ CARDS / TABLES ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
.card__head{padding:11px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.card__head h2{font-family:var(--cond);font-size:14px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.06em}
.card__head .btn{margin-left:auto}
.card__body{padding:14px}
.hint{color:var(--ink-3);font-size:11.5px;margin:0 0 12px}

table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:hover td{background:#FAFCFE}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-size:11.5px}
.tbl input,.tbl select{padding:3px 6px;font-size:12px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-3)}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag--ok{color:var(--ok);border-color:#BCE3D2;background:#EDF8F3}
.tag--run{color:var(--accent);border-color:#C6D0F3;background:var(--accent-soft)}
.tag--late{color:var(--alert);border-color:#EBC7C4;background:#FBEEED}
.tag--todo{color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi__k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.kpi__v{font-family:var(--cond);font-size:27px;font-weight:600;line-height:1.15;margin-top:2px;letter-spacing:-.01em}
.kpi__n{font-size:11px;color:var(--ink-3)}

.prog{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:52px}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ============ GANTT ============ */
.gantt-toolbar{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gantt-scroll{flex:1;overflow:auto;position:relative;background:var(--surface)}
.gantt-inner{position:relative;min-width:min-content}

.g-head{position:sticky;top:0;z-index:30;display:flex;background:var(--surface)}
.g-head__left{position:sticky;left:0;z-index:32;width:var(--leftw);flex:none;background:var(--surface);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:0 10px 6px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.g-head__time{position:relative;border-bottom:1px solid var(--line);height:52px}
.g-tick{position:absolute;top:0;height:26px;border-left:1px solid var(--line-soft);
  font-family:var(--cond);font-size:11px;font-weight:600;color:var(--ink-2);padding:5px 0 0 6px;
  text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;overflow:hidden}
.g-tick--major{top:0;height:26px;background:var(--surface-2);border-left:1px solid var(--line);color:var(--ink)}
.g-tick--minor{top:26px;height:26px;font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--ink-3);letter-spacing:.03em;padding-top:7px}

.g-ribbon{position:relative;height:22px;border-bottom:1px solid var(--line)}
.g-ribbon__left{position:sticky;left:0;z-index:2;width:var(--leftw);height:100%;background:var(--surface);border-right:1px solid var(--line);
  display:flex;align-items:center;padding:0 10px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.g-phase{position:absolute;top:3px;height:16px;border-radius:2px;color:#fff;font-family:var(--cond);font-size:10px;
  font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:0 7px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}

.g-body{position:relative}
.g-grid{position:absolute;top:0;left:0;height:100%;pointer-events:none;z-index:0}
.g-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft)}
.g-grid i.major{background:var(--line)}
.g-grid u{position:absolute;top:0;bottom:0;background:#F3F6F9;text-decoration:none}
.g-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--signal);z-index:12;pointer-events:none}
.g-today::before{content:"AUJ.";position:absolute;top:2px;left:3px;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:#A96F13}
.g-links{position:absolute;top:0;left:0;z-index:11;pointer-events:none;overflow:visible}

.g-row{display:flex;height:var(--row-h);position:relative;z-index:1;border-bottom:1px solid var(--line-soft)}
.g-row:hover .g-row__left{background:#F2F7FC}
.g-row:hover .g-row__time{background:rgba(60,110,170,.045)}
.g-row.is-sel .g-row__left{background:var(--accent-soft)}
.g-row__left{position:sticky;left:0;z-index:5;width:var(--leftw);flex:none;background:var(--surface);
  border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;overflow:hidden}
.g-row__time{position:relative;flex:none}
.g-row--l1 .g-row__left{background:var(--surface-2);font-weight:600}
.g-row--l1:hover .g-row__left{background:#EAF0F6}

.twist{width:14px;height:14px;flex:none;border:0;background:none;cursor:pointer;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;font-size:9px;padding:0}
.twist:hover{color:var(--ink)}
.twist.is-leaf{visibility:hidden}
.wbs{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none;letter-spacing:-.01em}
.g-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:12.5px}
.g-name--milestone{font-style:italic}
.g-meta{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none}
.g-row__left .rowbtn{opacity:0;border:0;background:none;cursor:pointer;color:var(--ink-3);padding:0 2px;font-size:13px;line-height:1}
.g-row:hover .rowbtn{opacity:1}
.g-row__left .rowbtn:hover{color:var(--accent)}

.bar{position:absolute;top:6px;height:18px;border-radius:3px;cursor:grab;overflow:hidden;
  box-shadow:0 1px 0 rgba(16,25,35,.14);min-width:3px}
.bar__fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.42)}
.bar__lbl{position:absolute;left:100%;top:0;height:100%;display:flex;align-items:center;padding-left:7px;
  font-family:var(--mono);font-size:10px;color:var(--ink-2);white-space:nowrap;pointer-events:none}
.bar.is-drag{cursor:grabbing;opacity:.85}
.bar__grip{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;opacity:0}
.bar__grip--l{left:0}.bar__grip--r{right:0}
.bar:hover .bar__grip{opacity:1;background:rgba(255,255,255,.5)}
.bar--sum{top:9px;height:11px;border-radius:2px;cursor:default;box-shadow:none}
.bar--sum::before,.bar--sum::after{content:"";position:absolute;bottom:-4px;border-top:5px solid;border-top-color:inherit;
  border-left:4px solid transparent;border-right:4px solid transparent}
.bar--sum::before{left:0}.bar--sum::after{right:0}
.ms{position:absolute;top:7px;width:15px;height:15px;transform:rotate(45deg);border-radius:2px;cursor:grab}
.ms__lbl{position:absolute;top:0;height:var(--row-h);display:flex;align-items:center;font-family:var(--mono);font-size:10px;
  color:var(--ink-2);white-space:nowrap;pointer-events:none}

/* ============ DISPO ============ */
.matrix-wrap{overflow:auto;max-height:calc(100vh - 260px);border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.matrix{border-collapse:separate;border-spacing:0;font-family:var(--mono);font-size:11px}
.matrix th,.matrix td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);padding:0;text-align:center;white-space:nowrap}
.matrix thead th{min-width:58px;position:sticky;top:0;z-index:3;background:var(--surface-2);height:36px;padding:0 8px;
  font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--line)}
.matrix th.stick,.matrix td.stick{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;
  padding:0 10px;min-width:190px;max-width:190px;border-right:1px solid var(--line);font-family:var(--sans);font-size:12px}
.matrix thead th.stick{z-index:5}
.matrix td{height:28px}
.matrix .cell{width:100%;height:26px;border:0;background:transparent;text-align:center;font-family:var(--mono);font-size:11px;padding:0}
.matrix .cell:hover{background:var(--accent-soft)}
.matrix td.q0{background:#FBEEED}.matrix td.q1{background:#FDF6EA}
.matrix td.q2{background:#F2F8F5}.matrix td.q3{background:#E8F4EE}
.matrix td.over .cell{color:var(--alert);font-weight:600}
.matrix tr.sum td{background:var(--surface-2);font-weight:600;color:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.07em;margin-top:10px;align-items:center}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}

/* ============ PLAN D'ACTION ============ */
.section{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden}
.section__head{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--surface-2);border-bottom:1px solid var(--line-soft)}
.section__head h3{font-family:var(--cond);font-size:14px;margin:0;font-weight:600;letter-spacing:.03em}
.section__count{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.section__tools{margin-left:auto;display:flex;gap:6px}
.action-empty{padding:16px 13px;color:var(--ink-3);font-size:12px}
.chk{width:14px;height:14px;accent-color:var(--accent)}
.overdue{color:var(--alert);font-weight:600}

/* ============ MODAL / TOAST ============ */
.scrim{position:fixed;inset:0;background:rgba(16,25,35,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--surface);border-radius:8px;width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(16,25,35,.28)}
.modal__head{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center}
.modal__head h2{font-family:var(--cond);font-size:16px;margin:0;text-transform:uppercase;letter-spacing:.05em}
.modal__head button{margin-left:auto;background:none;border:0;font-size:20px;cursor:pointer;color:var(--ink-3);line-height:1}
.modal__body{padding:18px;overflow:auto}
.modal__foot{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end}
.modal__foot .left{margin-right:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:20px;font-size:12px;z-index:300;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}

/* ---- groupes de navigation ---- */
.rail__group{font-family:var(--mono);font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;color:#5E7086;
  padding:13px 10px 5px;margin-top:5px;border-top:1px solid rgba(255,255,255,.08)}
.rail__group:first-child{border-top:0;margin-top:0;padding-top:2px}
.railsave{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important;font-family:var(--sans)!important;
  font-size:12px!important;padding:7px 10px!important;font-weight:600}
.railsave[data-clean="1"]{background:transparent!important;border-color:rgba(255,255,255,.18)!important;color:#8A9AAC!important;font-weight:400}
.topbar__eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:1px}
/* ---- navigation jour ---- */
.daynav{display:flex;align-items:center;gap:7px}
.daynav__lbl{font-size:11px;color:var(--ink-2);min-width:212px;text-align:center}
.daynav__chk{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.g-head__time--day .g-tick--minor{line-height:1.2;padding-top:4px;color:var(--ink-2)}
.g-head__time--day .g-tick--minor b{font-family:var(--cond);font-size:12px;font-weight:600;color:var(--ink)}
.g-tick--off{background:#F1F4F8;color:var(--ink-3)}
.g-tick--off b{color:var(--ink-3)!important}
/* ---- briques de périmètre ---- */
.bricks{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.brick{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--bc);border-radius:6px;padding:12px 13px 13px}
.brick__head{display:flex;align-items:center;gap:8px}
.brick__title{font-family:var(--cond);font-size:15px;font-weight:600;flex:1;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.brick__pct{font-size:12px;color:var(--ink-2)}
.brick__bar{height:5px;background:var(--line-soft);border-radius:3px;margin:9px 0 6px;overflow:hidden}
.brick__bar>i{display:block;height:100%;border-radius:3px}
.brick__meta{font-size:11px;color:var(--ink-3);margin-bottom:10px}
.brick__add{margin-top:10px;width:100%}
.procs{display:flex;flex-direction:column;gap:4px}
.proc{display:grid;grid-template-columns:54px 1fr 92px;gap:2px 7px;align-items:center;width:100%;text-align:left;
  border:1px solid var(--line-soft);border-left:3px solid var(--ink-3);background:var(--surface-2);border-radius:3px;padding:5px 8px;cursor:pointer;font:inherit}
.proc:hover{background:#fff;border-color:var(--line);border-left-color:inherit}
.proc__code{grid-area:1/1;font-size:10px;color:var(--ink-3)}
.proc__nom{grid-area:1/2;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proc__cov{grid-area:2/2;font-size:10.5px;color:var(--ink-3)}
.proc__st{grid-area:1/3/3/4;align-self:center;text-align:right;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.06em;text-transform:uppercase;line-height:1.25}
.v-non{border-left-color:#B7C2CE}.v-non .proc__st{color:var(--ink-3)}
.v-atelier{border-left-color:#3C63E0}.v-atelier .proc__st{color:#3C63E0}
.v-arb{border-left-color:#E8A33D}.v-arb .proc__st{color:#A9750F}

<script>
/* ============================================================================
 *  PILOTAGE ERP — Couche d'accès Supabase (étape 2)
 *  Fichier autonome. Il n'est PAS encore branché dans l'application : le
 *  branchement (remplacement de loadState/save/commit, éditeurs) est l'étape 3.
 *
 *  Ce module expose un objet global `DB` avec :
 *    Authentification (mot de passe)
 *      DB.init()                  -> charge la lib, restaure la session
 *      DB.signIn(email, mdp)      -> connexion
 *      DB.signOut()               -> déconnexion
 *      DB.currentUser()           -> { id, email } | null
 *      DB.role()                  -> 'lecteur' | 'editeur' | 'admin' | null
 *      DB.canEdit()               -> booléen
 *      DB.onAuthChange(cb)        -> notifie connexion/déconnexion
 *    Données
 *      DB.loadAll()               -> { collections:{coll:[objets]}, singletons:{key:objet} }
 *      DB.saveItem(coll, objet)   -> insère ou met à jour (verrou optimiste)
 *      DB.deleteItem(coll, id)    -> supprime
 *      DB.getItem(coll, id)       -> relit un élément (utile après conflit)
 *      DB.saveSingleton(key, obj) -> met à jour un objet unique
 *      DB.bulkUpsert(coll, objs)  -> import en masse (étape 6)
 *    Temps réel (optionnel, étape 5)
 *      DB.subscribe(onChange)     -> écoute les changements distants
 *
 *  CONVENTION DE VERSION (niveau 2)
 *    Chaque objet chargé porte une métadonnée cachée `_v` (version serveur) et
 *    `maj` (horodatage serveur, réutilisé tel quel par l'affichage existant).
 *    À la mise à jour, `_v` sert de garde : si la version a changé entre-temps,
 *    saveItem lève une erreur { code:'conflict', server:<version distante> }.
 *
 *  CONFIGURATION (à renseigner à l'étape 3, dans le HTML, AVANT ce script)
 *    <script>
 *      window.SUPABASE_CONFIG = {
 *        url: "https://pzbbdclhdxlmohtmpgnr.supabase.co",
 *        key: "<VOTRE_CLE_PUBLISHABLE>"   // clé publishable/anon, jamais la secret
 *      };
 *    <\/script>
 *  La clé publishable est publique par nature : elle est sans risque côté client
 *  tant que le RLS est actif (ce qui est le cas). Ne jamais mettre la clé secret.
 * ========================================================================== */
(function () {
  'use strict';

  const LIB = 'https://esm.sh/@supabase/supabase-js@2'; // épinglable en @2.x.y
  const CFG = (typeof window !== 'undefined' && window.SUPABASE_CONFIG) || {};

  let sb = null;             // client Supabase
  let session = null;        // session courante
  let profileRole = null;    // rôle applicatif de l'utilisateur
  const authListeners = [];

  /* ---- utilitaires ------------------------------------------------------ */

  // Sépare les métadonnées client (colonnes gérées par la base) du corps métier.
  const META = ['_v', '_by', 'maj', 'id'];
  function stripMeta(obj) {
    const data = {};
    for (const k in obj) if (!META.includes(k)) data[k] = obj[k];
    return data;
  }
  // Reconstruit l'objet applicatif à partir d'une ligne `items`.
  function hydrateItem(row) {
    return Object.assign({}, row.data, {
      id: row.id, maj: row.updated_at, _v: row.version, _by: row.updated_by
    });
  }
  function hydrateSingleton(row) {
    return Object.assign({}, row.data, {
      maj: row.updated_at, _v: row.version, _by: row.updated_by
    });
  }
  function err(code, message, extra) {
    return Object.assign(new Error(message || code), { code }, extra || {});
  }
  // Normalise une erreur PostgREST/Supabase en code métier.
  function mapError(e) {
    if (!e) return null;
    const status = e.status || e.code;
    if (e.code === '42501' || status === 403) return err('forbidden', "Droits insuffisants pour cette action.");
    if (e.code === '23505') return err('conflict', "Cet identifiant existe déjà.");
    if (status === 401) return err('auth', "Session expirée, reconnectez-vous.");
    return err('error', e.message || 'Erreur inattendue', { cause: e });
  }

  /* ---- initialisation & session ---------------------------------------- */

  async function init() {
    if (sb) return currentUser();
    if (!CFG.url || !CFG.key) throw err('config', "window.SUPABASE_CONFIG manquant (url + key).");
    const mod = await import(LIB);
    sb = mod.createClient(CFG.url, CFG.key, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    const { data } = await sb.auth.getSession();
    session = data.session || null;
    if (session) await loadRole();
    // Propage les changements de session (connexion, déconnexion, refresh).
    sb.auth.onAuthStateChange(async (_evt, s) => {
      session = s || null;
      profileRole = null;
      if (session) await loadRole();
      authListeners.forEach(cb => { try { cb(currentUser()); } catch (_) {} });
    });
    return currentUser();
  }

  async function loadRole() {
    if (!session) { profileRole = null; return null; }
    const { data, error } = await sb
      .from('profiles').select('role').eq('user_id', session.user.id).maybeSingle();
    if (error) { profileRole = null; return null; }
    profileRole = data ? data.role : 'lecteur';
    return profileRole;
  }

  async function signIn(email, password) {
    if (!sb) await init();
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw err('auth', "Identifiants incorrects ou compte non confirmé.");
    session = data.session;
    await loadRole();
    return currentUser();
  }

  async function signOut() {
    if (!sb) return;
    await sb.auth.signOut();
    session = null; profileRole = null;
  }

  function currentUser() {
    if (!session) return null;
    return { id: session.user.id, email: session.user.email };
  }
  function role() { return profileRole; }
  function canEdit() { return profileRole === 'editeur' || profileRole === 'admin'; }
  function onAuthChange(cb) { authListeners.push(cb); }

  /* ---- lecture ---------------------------------------------------------- */

  async function loadAll() {
    if (!sb) await init();
    const collections = {};
    const [it, sg] = await Promise.all([
      sb.from('items').select('*'),
      sb.from('singletons').select('*')
    ]);
    if (it.error) throw mapError(it.error);
    if (sg.error) throw mapError(sg.error);
    for (const row of it.data) {
      (collections[row.coll] = collections[row.coll] || []).push(hydrateItem(row));
    }
    const singletons = {};
    for (const row of sg.data) singletons[row.key] = hydrateSingleton(row);
    return { collections, singletons };
  }

  async function getItem(coll, id) {
    const { data, error } = await sb
      .from('items').select('*').eq('coll', coll).eq('id', id).maybeSingle();
    if (error) throw mapError(error);
    return data ? hydrateItem(data) : null;
  }

  /* ---- écriture (verrou optimiste de niveau 2) -------------------------- */

  // Insère (si pas de _v) ou met à jour (si _v présent). En cas de version
  // périmée, lève { code:'conflict', server:<objet distant à jour> }.
  async function saveItem(coll, obj) {
    if (!sb) await init();
    const data = stripMeta(obj);

    if (obj._v == null) {                       // création
      const { data: rows, error } = await sb
        .from('items').insert({ coll, id: obj.id, data }).select();
      if (error) throw mapError(error);
      return hydrateItem(rows[0]);
    }

    // mise à jour conditionnée à la version connue
    const { data: rows, error } = await sb
      .from('items').update({ data })
      .eq('coll', coll).eq('id', obj.id).eq('version', obj._v)
      .select();
    if (error) throw mapError(error);
    if (!rows || rows.length === 0) {           // aucune ligne : conflit ou disparu
      const server = await getItem(coll, obj.id);
      throw err('conflict', "Cet élément a été modifié par un autre utilisateur.", { server });
    }
    return hydrateItem(rows[0]);
  }

  async function deleteItem(coll, id) {
    if (!sb) await init();
    const { error } = await sb.from('items').delete().eq('coll', coll).eq('id', id);
    if (error) throw mapError(error);
    return true;
  }

  async function saveSingleton(key, obj) {
    if (!sb) await init();
    const data = stripMeta(obj);
    if (obj._v == null) {                       // première écriture (insertion)
      const up = await sb.from('singletons').upsert({ key, data }, { onConflict: 'key' }).select();
      if (up.error) throw mapError(up.error);
      let row = up.data && up.data[0];
      if (!row) { const g = await sb.from('singletons').select('*').eq('key', key).maybeSingle();
                  if (g.error) throw mapError(g.error); row = g.data; }
      return row ? hydrateSingleton(row) : Object.assign({}, obj, { _v: 1 });
    }
    const { data: rows, error } = await sb
      .from('singletons').update({ data })
      .eq('key', key).eq('version', obj._v).select();
    if (error) throw mapError(error);
    if (!rows || rows.length === 0) {
      const { data: cur } = await sb.from('singletons').select('*').eq('key', key).maybeSingle();
      if (cur) throw err('conflict', "Ce paramètre a été modifié par un autre utilisateur.", { server: hydrateSingleton(cur) });
      const ins = await sb.from('singletons').upsert({ key, data }, { onConflict: 'key' }).select();
      if (ins.error) throw mapError(ins.error);
      return ins.data && ins.data[0] ? hydrateSingleton(ins.data[0]) : Object.assign({}, obj, { _v: 1 });
    }
    return hydrateSingleton(rows[0]);
  }

  // Import en masse (étape 6). Réservé aux éditeurs/admins par le RLS.
  async function bulkUpsert(coll, objs) {
    if (!sb) await init();
    const payload = objs.map(o => ({ coll, id: o.id, data: stripMeta(o) }));
    const { error } = await sb.from('items').upsert(payload, { onConflict: 'coll,id' });
    if (error) throw mapError(error);
    return objs.length;
  }

  /* ---- temps réel (optionnel, étape 5) ---------------------------------- */
  // Nécessite d'avoir activé la publication realtime dans schema.sql.
  let channel = null;
  function subscribe(onChange) {
    if (!sb || channel) return;
    channel = sb.channel('pilotage')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'items' },
          p => { try { onChange('items', p); } catch (_) {} })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'singletons' },
          p => { try { onChange('singletons', p); } catch (_) {} })
      .subscribe();
  }
  function unsubscribe() { if (channel) { sb.removeChannel(channel); channel = null; } }

  /* ---- exposition ------------------------------------------------------- */
  async function listProfiles(){
    if (!sb) await init();
    const { data, error } = await sb.from('profiles').select('user_id,email,role').order('email');
    if (error) throw mapError(error);
    return data;
  }
  async function setRole(userId, newRole){
    if (!sb) await init();
    const { data, error } = await sb.from('profiles').update({ role: newRole }).eq('user_id', userId).select();
    if (error) throw mapError(error);
    if (!data || !data.length) throw err('forbidden', "Modification refusée (droits insuffisants).");
    return data[0];
  }
  window.DB = {
    listProfiles, setRole,
    init, signIn, signOut, currentUser, role, canEdit, onAuthChange,
    loadAll, getItem, saveItem, deleteItem, saveSingleton, bulkUpsert,
    subscribe, unsubscribe,
    hydrateItem, hydrateSingleton   // exposés pour l'étape 5 (temps réel)
  };
})();

const s2d = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d); };

}

/* ---------- persistance ---------- */
let saveTimer=null, storageOK=true, dirty=false, dernierEnr=null;
async function loadState(){
  if(cloudEnabled()){ await hydrateFromCloud(); PERSIST.mode='cloud'; return; }
  try{
    const r = await window.storage.get(STORE_KEY);
    if(r && r.value){ state = JSON.parse(r.value); migrer(); normalizeStamps(); return; }
  }catch(e){ /* clé absente : premier lancement */ }
  state = seed();
  normalizeStamps();
  await commit();
}
function normalizeStamps(){
  const base = state.projet && state.projet.debut ? state.projet.debut : today();
  const baseISO = new Date(base+'T09:00:00').toISOString();
  ['taches','actions','acteurs','systemes','domaines','processus','transformations','formations',
   'commGroupes','evenements','regles','budget','realisation','demandes','documents','attendus',
   'roles','boutEnBout','planBascule','bascule','repetitions','photos','donnees','campagnes'].forEach(k=>{
    (state[k]||[]).forEach(o=>{ if(!o.creeLe) o.creeLe=base; if(!o.maj) o.maj=baseISO;
      if(k==='donnees'){ (o.champs||[]).forEach(c=>{ if(!c.maj) c.maj=baseISO; }); }
      if(k==='campagnes'){ (o.tests||[]).forEach(t=>{ if(!t.maj) t.maj=baseISO; }); } });
  });
}
function migrer(){
  const s = seed();
  ['systemes','domaines','processus','transformations','formations','sections','absences',
   'commGroupes','evenements','regles','budget','realisation','demandes','documents','attendus',
   'roles','boutEnBout','planBascule','bascule','repetitions','photos','donnees','campagnes'].forEach(k=>{
    if(!Array.isArray(state[k])) state[k]=s[k];
  });
  if(!state.charte) state.charte=s.charte;
  if(!state.testStrategie) state.testStrategie=s.testStrategie;
  (state.bascule||[]).forEach(b=>{ if(!b.donneeId && b.typeDonnee){ const o=(state.donnees||[]).find(d=>d.nom===b.typeDonnee); if(o) b.donneeId=o.id; } });
  if(!state.dispos) state.dispos={};
  if(!state.params) state.params=s.params;
  if(!state.params.zoom) state.params.zoom='mois';
}
function save(){                       // marque une modification et programme l'enregistrement
  dirty=true; majSave();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(commit, 2000);
}
async function commit(){               // écriture effective
  clearTimeout(saveTimer);
  try{
    await window.storage.set(STORE_KEY, JSON.stringify(state));
    dirty=false; dernierEnr=new Date(); storageOK=true;
  }catch(e){ storageOK=false; }
  majSave();
}
function majSave(){
  const b=$('#btnSave');
  if(!storageOK){ setStoreState('Enregistrement indisponible — exportez le projet'); if(b){b.dataset.clean='0';b.textContent='Réessayer';} return; }
  if(dirty){ setStoreState('Modifications non enregistrées'); if(b){b.dataset.clean='0';b.textContent='Enregistrer les modifications';} }
  else { setStoreState(dernierEnr? 'Enregistré à '+dernierEnr.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : 'À jour');
         if(b){b.dataset.clean='1';b.textContent='Tout est enregistré';} }
}
function setStoreState(t){ const el=$('#storeState'); if(el) el.textContent=t; }

/* ============================================================
   PERSISTANCE — adaptateur local / cloud
   mode 'local' : window.storage (comportement mono-poste d'origine)
   mode 'cloud' : Supabase via DB (activé après connexion — étape 3c)
   ============================================================ */
const PERSIST = {
  mode: 'local',
  arr(coll){ return (state[coll] = state[coll] || []); },
  place(coll, obj){
    const a=this.arr(coll); const i=a.findIndex(x=>x.id===obj.id);
    if(i>=0) a[i]=obj; else a.push(obj); return obj;
  },
  async saveItem(coll, obj){
    if(this.mode==='cloud' && !DB.canEdit()) throw {code:'forbidden', message:'Compte en lecture seule.'};
    if(this.mode==='cloud'){ const saved=await DB.saveItem(coll, obj); this.place(coll, saved); return saved; }
    this.place(coll, obj); save(); return obj;
  },
  async deleteItem(coll, id){
    if(this.mode==='cloud' && !DB.canEdit()) throw {code:'forbidden', message:'Compte en lecture seule.'};
    if(this.mode==='cloud') await DB.deleteItem(coll, id);
    const a=this.arr(coll); const i=a.findIndex(x=>x.id===id); if(i>=0) a.splice(i,1);
    if(this.mode!=='cloud') save();
    return true;
  },
  async saveSingleton(key, obj){
    if(this.mode==='cloud' && !DB.canEdit()) throw {code:'forbidden', message:'Compte en lecture seule.'};
    if(this.mode==='cloud'){ const saved=await DB.saveSingleton(key, obj); if(saved){ obj._v=saved._v; obj.maj=saved.maj; } return saved; }
    save(); return obj;
  }
};
function handleWriteError(e, coll, id){
  const code = e && e.code;
  if(code==='forbidden'){ toast('Droits insuffisants : votre compte est en lecture seule.'); return; }
  if(code==='auth'){ toast('Session expirée. Reconnectez-vous.'); return; }
  if(code==='conflict'){
    if(e.server) PERSIST.place(coll, e.server);
    else { const a=PERSIST.arr(coll); const i=a.findIndex(x=>x.id===id); if(i>=0) a.splice(i,1); }
    render();
    toast('Conflit : cet élément vient d\'être modifié par un autre utilisateur. La version à jour est affichée.');
    return;
  }
  console.error(e); toast('Erreur d\'enregistrement.');
}
async function regCommit(cfg, obj, isNew){
  try{
    await PERSIST.saveItem(cfg.store, obj);
    $('#modalRoot').innerHTML=''; render();
    toast(isNew?'Élément ajouté':'Élément modifié');
  }catch(e){ handleWriteError(e, cfg.store, obj.id); }
}
async function commitEntity(coll, obj, isNew, okMsg){
  try{ await PERSIST.saveItem(coll, obj); $('#modalRoot').innerHTML=''; render(); if(okMsg) toast(okMsg); }
  catch(e){ handleWriteError(e, coll, obj.id); }
}
async function deleteEntity(coll, id, okMsg){
  try{ await PERSIST.deleteItem(coll, id); $('#modalRoot').innerHTML=''; render(); if(okMsg) toast(okMsg); }
  catch(e){ handleWriteError(e, coll, id); }
}
async function deleteEntities(coll, ids, extra, okMsg){
  try{
    for(const i of ids){ await PERSIST.deleteItem(coll, i); }
    if(extra){ for(const x of extra){ await PERSIST.saveItem(x.coll, x.obj); } }
    $('#modalRoot').innerHTML=''; render(); if(okMsg) toast(okMsg);
  }catch(err){ handleWriteError(err, coll, ids[0]); }
}

/* ============================================================
   CLOUD — amorçage, objets uniques, connexion, rôles
   ============================================================ */
const CLOUD_COLLS = ['phases','taches','acteurs','absences','sections','actions','systemes','domaines',
  'processus','transformations','formations','commGroupes','evenements','regles','budget','realisation',
  'demandes','documents','attendus','roles','boutEnBout','planBascule','bascule','repetitions','donnees','campagnes','photos'];
const CLOUD_SINGLES = ['projet','params','charte','testStrategie','dispos'];
function cloudEnabled(){ const c=window.SUPABASE_CONFIG||{}; return !!(c.url && c.key && c.key!=='REMPLACER_PAR_LA_CLE_PUBLISHABLE'); }
function persistSingleton(key){
  if(state[key]===undefined) return;
  PERSIST.saveSingleton(key, state[key]).catch(e=>handleWriteError(e, key, key));
}
async function publishAll(){
  for(const coll of CLOUD_COLLS){ const a=state[coll]; if(Array.isArray(a) && a.length){ try{ await DB.bulkUpsert(coll, a); }catch(e){ console.error('Publication '+coll+' échouée :', e); } } }
  for(const key of CLOUD_SINGLES){ if(state[key]!==undefined){ try{ const sv=await DB.saveSingleton(key, state[key]); if(sv){ state[key]._v=sv._v; state[key].maj=sv.maj; } }catch(e){ console.error('Publication singleton "'+key+'" échouée :', e); } } }
}
function mergeCloud(res){
  CLOUD_COLLS.forEach(c=>{ if(res.collections[c]) state[c]=res.collections[c]; });
  CLOUD_SINGLES.forEach(k=>{ if(res.singletons[k]!==undefined) state[k]=res.singletons[k]; });
}
async function hydrateFromCloud(){
  let res = await DB.loadAll();
  const nCol = Object.values(res.collections).reduce((n,a)=>n+a.length,0);
  if(nCol===0 && Object.keys(res.singletons).length===0){
    state = seed(); normalizeStamps();
    await publishAll();
    res = await DB.loadAll();
  } else {
    state = seed();
  }
  CLOUD_COLLS.forEach(c=>{ state[c]=[]; });
  mergeCloud(res);
  // rattrapage : persister les objets uniques absents du cloud (_v absent = jamais écrit)
  for(const key of CLOUD_SINGLES){
    const o = state[key];
    if(o && o._v == null){
      try{ const sv = await DB.saveSingleton(key, o); if(sv){ o._v = sv._v; o.maj = sv.maj; } }
      catch(e){ console.error('Écriture du singleton "'+key+'" échouée :', e); }
    }
  }
}
async function resetCloud(){
  const res = await DB.loadAll();
  for(const coll of Object.keys(res.collections)){ for(const o of res.collections[coll]){ await DB.deleteItem(coll, o.id); } }
  await publishAll();
  CLOUD_COLLS.forEach(c=>{ state[c]=[]; });
  mergeCloud(await DB.loadAll());
}

/* ---------- helpers métier ---------- */
const phaseById = id => state.phases.find(p=>p.id===id);
const acteurById = id => state.acteurs.find(a=>a.id===id);
const tacheById = id => state.taches.find(t=>t.id===id);
const acteurNom = id => { const a=acteurById(id); return a? a.prenom+' '+a.nom : '—'; };
const statutDef = id => STATUTS.find(s=>s.id===id) || STATUTS[0];
const enfants = pid => state.taches.filter(t=>t.parentId===pid);
function enfantsDePhase(phId){ return state.taches.filter(t=>t.phaseId===phId && !t.parentId); }
function estParent(id){ return state.taches.some(t=>t.parentId===id); }
function descendants(id){
  const out=[]; const walk=p=>enfants(p).forEach(c=>{out.push(c);walk(c.id);}); walk(id); return out;
}
function rollup(t){ // dates + avancement consolidés
  const kids = enfants(t.id);
  if(!kids.length) return {debut:t.debut,fin:t.fin,avancement:t.avancement||0,charge:t.charge||0};
  let deb=null,fin=null,pond=0,tot=0,ch=0;
  kids.forEach(k=>{
    const r=rollup(k);
    if(!deb||r.debut<deb) deb=r.debut;
    if(!fin||r.fin>fin) fin=r.fin;
    const w=Math.max(1,diffDays(r.debut,r.fin)+1);
    pond += (r.avancement||0)*w; tot+=w; ch+=r.charge||0;
  });
  return {debut:deb,fin:fin,avancement: tot?Math.round(pond/tot):0, charge:ch};
}
function phaseSpan(phId){
  const rs = enfantsDePhase(phId).map(rollup);
  if(!rs.length) return null;
  return {debut:rs.reduce((a,r)=>!a||r.debut<a?r.debut:a,null), fin:rs.reduce((a,r)=>!a||r.fin>a?r.fin:a,null),
    avancement: Math.round(rs.reduce((s,r)=>s+r.avancement,0)/rs.length)};
}
function horizon(){
  let d=state.projet.debut, f=state.projet.fin;
  state.taches.forEach(t=>{ if(t.debut&&t.debut<d)d=t.debut; if(t.fin&&t.fin>f)f=t.fin; });
  return {debut:d,fin:f};
}
function dispoPct(acteurId,key){
  const v = state.dispos[acteurId+'|'+key];
  if(v===undefined||v===null||v==='') { const a=acteurById(acteurId); return a?a.dispoDefaut:0; }
  return Number(v);
}
function capaciteJours(acteurId,key){ return Math.round(workdaysInMonth(key)*dispoPct(acteurId,key)/100*10)/10; }
function chargeParMois(){ // {acteurId|key: jours}
  const out={};
  state.taches.forEach(t=>{
    if(!t.responsableId || t.type==='jalon' || !t.charge || estParent(t.id)) return;
    const nb = workdaysBetween(t.debut,t.fin) || 1;
    const parJour = t.charge/nb;
    let cur=s2d(t.debut), end=s2d(t.fin);
    while(cur<=end){
      if(isWorkday(cur)){ const k=t.responsableId+'|'+monthKey(cur); out[k]=(out[k]||0)+parJour; }
      cur=new Date(cur.getTime()+DAY);
    }
  });
  Object.keys(out).forEach(k=>out[k]=Math.round(out[k]*10)/10);
  return out;
}

  const charge = state.taches.filter(t=>!estParent(t.id)).reduce((s,t)=>s+(t.charge||0),0);

  const jalons = state.taches.filter(t=>t.type==='jalon').sort((a,b)=>a.debut.localeCompare(b.debut));

const ZOOMS = {jour:{ppd:26,lbl:'Jour'}, semaine:{ppd:11,lbl:'Semaine'}, mois:{ppd:3.2,lbl:'Mois'}, trimestre:{ppd:1.15,lbl:'Trimestre'}};

function isoWeek(d){
  const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const w1=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-w1)/DAY-3+((w1.getDay()+6)%7))/7);
}
function drawLinks(rows,x,z,leftW){
  const svg=$('#gLinks'); if(!svg) return;
  const idx={}; rows.forEach((r,i)=>idx[r.id]=i);
  let p='';
  rows.forEach((r,i)=>{
    if(r.kind!=='tache'||!r.tache.dependances) return;
    r.tache.dependances.forEach(dep=>{
      if(idx[dep]===undefined) return;
      const src=rows[idx[dep]]; if(!src.span) return;
      const y1=idx[dep]*32+16, y2=i*32+16;
      const x1=leftW+x(src.span.fin)+z.ppd, x2=leftW+x(r.span.debut);
      const mid=x2-8;
      p+=`<path d="M${x1},${y1} H${Math.max(x1+6,mid)} V${y2} H${x2}" fill="none" stroke="#7C8B9B" stroke-width="1" stroke-dasharray="2 2"/>
          <path d="M${x2},${y2} l-5,-3.5 v7 z" fill="#7C8B9B"/>`;
    });
  });
  svg.innerHTML=p;
}

function wireGantt(rows,start,z){
  const body=$('#gBody'); if(!body) return;
  body.addEventListener('click', e=>{
    const tw=e.target.closest('[data-tw]');
    if(tw){ const id=tw.dataset.tw; collapsed.has(id)?collapsed.delete(id):collapsed.add(id); renderGantt(); return; }
    const ed=e.target.closest('[data-edit]'); if(ed){ editTache(ed.dataset.edit); return; }
    const sb=e.target.closest('[data-sub]'); if(sb){ const p=tacheById(sb.dataset.sub); editTache(null,{parentId:p.id,phaseId:p.phaseId,debut:p.debut,fin:p.fin}); return; }
    const row=e.target.closest('[data-row]');
    if(row){ selTache = selTache===row.dataset.row?null:row.dataset.row; renderGantt(); }
  });
  body.addEventListener('dblclick', e=>{
    const row=e.target.closest('[data-row]');
    if(row && !row.dataset.row.startsWith('PH-')) editTache(row.dataset.row);
  });

  // déplacement / redimensionnement
  body.addEventListener('mousedown', e=>{
    const bar=e.target.closest('[data-role="bar"]');
    if(!bar||!bar.dataset.id) return;
    const t=tacheById(bar.dataset.id); if(!t||estParent(t.id)) return;
    const mode = e.target.classList.contains('bar__grip--l')?'l':e.target.classList.contains('bar__grip--r')?'r':'move';
    const x0=e.clientX, d0=t.debut, f0=t.fin;
    bar.classList.add('is-drag'); e.preventDefault();
    const mv=ev=>{
      const dd=Math.round((ev.clientX-x0)/z.ppd);
      if(mode==='move'){ t.debut=addDays(d0,dd); t.fin=addDays(f0,dd); }
      else if(mode==='l'){ const nd=addDays(d0,dd); if(nd<=t.fin) t.debut=nd; }
      else { const nf=addDays(f0,dd); if(nf>=t.debut) t.fin=nf; }
      const a=Math.round(diffDays(start,t.debut)*z.ppd);
      bar.style.left=a+'px';
      if(t.type!=='jalon') bar.style.width=Math.max(3,Math.round(diffDays(start,t.fin)*z.ppd)+z.ppd-a)+'px';
    };
    const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
      bar.classList.remove('is-drag'); PERSIST.saveItem('taches', t).catch(e=>handleWriteError(e,'taches',t.id)); renderGantt(); toast(`${t.nom} — ${fmtFR(t.debut)} → ${fmtFR(t.fin)}`); };
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });
}

function modal({titre,corps,ok='Enregistrer',onOk,extra='',noSave=false}){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="scrim"><div class="modal" role="dialog" aria-modal="true">
    <div class="modal__head"><h2>${esc(titre)}</h2><button data-x aria-label="Fermer">×</button></div>
    <div class="modal__body">${corps}</div>
    <div class="modal__foot">${extra}<button class="btn" data-x>Annuler</button><button class="btn btn--primary" data-ok>${esc(ok)}</button></div>
  </div></div>`;
  const close=()=>root.innerHTML='';
  root.querySelectorAll('[data-x]').forEach(b=>b.onclick=close);
  root.querySelector('.scrim').onclick=e=>{ if(e.target===root.querySelector('.scrim')) close(); };
  root.querySelector('[data-ok]').onclick=()=>{ if(onOk(root)!==false){ close(); if(!noSave){ save(); render(); } } };
  document.onkeydown=e=>{ if(e.key==='Escape') close(); };
  const f=root.querySelector('input,select,textarea'); if(f) f.focus();
  return root;
}

    <div class="grid2">
      <label class="f"><span>Statut</span><select id="m_statut">${optStatuts(t.statut)}</select></label>
      <label class="f"><span>Prédécesseur (fin → début)</span><select id="m_dep"><option value="">— Aucun —</option>${
        state.taches.filter(x=>x.id!==id).map(x=>`<option value="${x.id}" ${(t.dependances||[])[0]===x.id?'selected':''}>${esc(x.nom)}</option>`).join('')}</select></label>
    </div>
    <label class="f"><span>Notes</span><textarea id="m_note">${esc(t.note||'')}</textarea></label>
    ${parent?'<p class="hint">Les dates, la charge et l\'avancement de cette ligne sont consolidés automatiquement à partir de ses sous-tâches.</p>':''}`;
  modal({titre: id?'Modifier la tâche':'Nouvelle tâche', corps,
    extra: id?`<button class="btn btn--danger left" id="m_del">Supprimer</button>`:'',
    onOk(root){
      const nom=$('#m_nom',root).value.trim();
      if(!nom){ $('#m_nom',root).focus(); toast('Indiquez un libellé.'); return false; }
      const type=$('#m_type',root).value;
      const o={nom, phaseId:$('#m_phase',root).value, parentId:$('#m_parent',root).value||null, type,
        debut:$('#m_debut',root).value, fin: type==='jalon'?$('#m_debut',root).value:$('#m_fin',root).value,
        responsableId:$('#m_resp',root).value||null, charge:Number($('#m_charge',root).value)||0,
        avancement:Number($('#m_av',root).value)||0, statut:$('#m_statut',root).value,
        dependances:$('#m_dep',root).value?[$('#m_dep',root).value]:[], note:$('#m_note',root).value};
      if(o.fin<o.debut) o.fin=o.debut;
      o.maj=nowStamp(); const isNew=!id;
      const target = id? Object.assign({}, tacheById(id), o) : Object.assign({id:uid('t'),creeLe:today()}, o);
      commitEntity('taches', target, isNew, isNew?'Tâche ajoutée':'Tâche modifiée');
      return false;
    }});
  if(id) $('#m_del').onclick=()=>{
    const kids=descendants(id);
    if(kids.length && !confirm(`Supprimer aussi les ${kids.length} sous-tâches ?`)) return;
    const del=new Set([id,...kids.map(k=>k.id)]);
    const touched=state.taches.filter(t=>!del.has(t.id) && (t.dependances||[]).some(d=>del.has(d)));
    touched.forEach(t=>t.dependances=(t.dependances||[]).filter(d=>!del.has(d)));
    deleteEntities('taches', [...del], touched.map(t=>({coll:'taches',obj:t})), 'Tâche supprimée');
  };
  const ty=$('#m_type'); ty.onchange=()=>{ $('#m_fin').disabled = ty.value==='jalon'; };
}

/* ============================================================
   PLAN D'ACTION
   ============================================================ */
let planFiltre={statut:'all',resp:'all',q:''};
function renderPlan(){
  const f=planFiltre;
  const visibles = state.actions.filter(a=>
    (f.statut==='all'||a.statut===f.statut) && (f.resp==='all'||a.responsableId===f.resp) &&
    (!f.q || (a.titre+' '+(a.detail||'')).toLowerCase().includes(f.q.toLowerCase())));
  const retard = a => a.statut!=='fait' && a.echeance && a.echeance<today();

  const secHTML = state.sections.slice().sort((a,b)=>a.ordre-b.ordre).map(sc=>{
    const list = visibles.filter(a=>a.sectionId===sc.id).sort((a,b)=>(a.echeance||'9').localeCompare(b.echeance||'9'));
    const fait = state.actions.filter(a=>a.sectionId===sc.id&&a.statut==='fait').length;
    const tot  = state.actions.filter(a=>a.sectionId===sc.id).length;
    return `<div class="section">
      <div class="section__head">
        <h3>${esc(sc.nom)}</h3><span class="section__count">${fait}/${tot} terminées</span>
        <div class="section__tools">
          <button class="btn btn--sm" data-addact="${sc.id}">Ajouter une action</button>
          <button class="btn btn--sm btn--ghost" data-rensec="${sc.id}">Renommer</button>
          <button class="btn btn--sm btn--ghost btn--danger" data-delsec="${sc.id}">Supprimer</button>
        </div>
      </div>
      ${list.length?`<table class="tbl">
        <thead><tr><th style="width:26px"></th><th>Action</th><th style="width:150px">Responsable</th><th style="width:104px">Échéance</th>
        <th style="width:110px">Statut</th><th style="width:78px">Priorité</th><th style="width:120px">Avancement</th><th style="width:104px">Modifié le</th><th style="width:56px"></th></tr></thead>
        <tbody>${list.map(a=>`<tr>
          <td><input type="checkbox" class="chk" data-done="${a.id}" ${a.statut==='fait'?'checked':''} title="Marquer comme terminée"></td>
          <td><div style="${a.statut==='fait'?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(a.titre)}</div>
              ${a.detail?`<div class="muted" style="font-size:11.5px">${esc(a.detail)}</div>`:''}</td>
          <td>${esc(acteurNom(a.responsableId))}</td>
          <td class="mono ${retard(a)?'overdue':''}">${fmtFR(a.echeance)}</td>
          <td><span class="tag ${retard(a)?'tag--late':statutDef(a.statut).cls}">${retard(a)?'En retard':statutDef(a.statut).nom}</span></td>
          <td class="mono">${(PRIORITES.find(p=>p.id===a.priorite)||{}).nom||'—'}</td>
          <td><div style="display:flex;align-items:center;gap:7px"><div class="prog" style="flex:1"><i style="width:${a.avancement||0}%"></i></div><span class="mono" style="font-size:11px">${a.avancement||0}%</span></div></td>
          <td class="mono muted" style="font-size:10.5px">${fmtDT(a.maj)}</td><td><button class="btn btn--sm btn--ghost" data-editact="${a.id}">✎</button></td></tr>`).join('')}</tbody></table>`
      :`<div class="action-empty">Aucune action dans cette section. Ajoutez la première pour lancer le suivi.</div>`}
    </div>`;
  }).join('');

  $('#view-plan').innerHTML = `
    <div class="card"><div class="card__body" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px">
      <input type="text" id="pq" placeholder="Rechercher une action…" value="${esc(f.q)}" style="width:250px">
      <select id="pst" style="width:170px"><option value="all">Tous les statuts</option>${optStatuts(f.statut)}</select>
      <select id="prs" style="width:190px"><option value="all">Tous les responsables</option>${state.acteurs.map(a=>`<option value="${a.id}" ${f.resp===a.id?'selected':''}>${esc(a.prenom+' '+a.nom)}</option>`).join('')}</select>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn" id="btnNewSec">Nouvelle section</button>
        <button class="btn btn--primary" id="btnNewAct">Nouvelle action</button>
      </div>
    </div></div>
    ${secHTML || '<div class="card"><div class="card__body muted">Créez une première section pour organiser le suivi des tâches.</div></div>'}`;

  $('#pq').oninput=e=>{planFiltre.q=e.target.value;renderPlan();$('#pq').focus();};
  $('#pst').onchange=e=>{planFiltre.statut=e.target.value;renderPlan();};
  $('#prs').onchange=e=>{planFiltre.resp=e.target.value;renderPlan();};
  $('#btnNewSec').onclick=()=>editSection(null);
  $('#btnNewAct').onclick=()=>editAction(null,{sectionId:(state.sections[0]||{}).id});
  $('#view-plan').onclick=e=>{
    const t=e.target;
    if(t.dataset.addact) editAction(null,{sectionId:t.dataset.addact});
    if(t.dataset.editact) editAction(t.dataset.editact);
    if(t.dataset.rensec) editSection(t.dataset.rensec);
    if(t.dataset.delsec){
      const n=state.actions.filter(a=>a.sectionId===t.dataset.delsec).length;
      if(confirm(`Supprimer cette section${n?' et ses '+n+' actions':''} ?`)){
        const secId=t.dataset.delsec;
        const acts=state.actions.filter(a=>a.sectionId===secId);
        (async()=>{ try{
          for(const a of acts){ await PERSIST.deleteItem('actions', a.id); }
          await PERSIST.deleteItem('sections', secId);
          render(); toast('Section supprimée');
        }catch(err){ handleWriteError(err,'sections',secId); } })();
      }
    }
    if(t.dataset.done!==undefined && t.type==='checkbox'){
      const a=state.actions.find(x=>x.id===t.dataset.done);
      a.statut = t.checked?'fait':'cours'; a.avancement = t.checked?100:a.avancement;
      PERSIST.saveItem('actions', a).catch(e=>handleWriteError(e,'actions',a.id)); renderPlan();
    }
  };
}

  modal({titre:id?'Renommer la section':'Nouvelle section',
    corps:`<label class="f"><span>Nom de la section</span><input type="text" id="s_nom" value="${esc(s.nom)}" placeholder="Ex. Risques à traiter"></label>

}

      const o={titre,detail:$('#a_d',r).value,sectionId:$('#a_s',r).value,responsableId:$('#a_r',r).value||null,

/* ============================================================
   DISPONIBILITÉS
   ============================================================ */
let dispoAn='all';
function joursAbsence(acteurId,key){
  let n=0;
  state.absences.filter(a=>a.acteurId===acteurId).forEach(a=>{
    let cur=s2d(a.debut), end=s2d(a.fin);
    while(cur<=end){ if(monthKey(cur)===key && isWorkday(cur)) n++; cur=new Date(cur.getTime()+DAY); }
  });
  return n;
}
function renderDispo(){
  const h=horizon();
  let keys=monthsRange(h.debut,h.fin);
  const annees=[...new Set(keys.map(k=>k.slice(0,4)))];
  if(dispoAn!=='all') keys=keys.filter(k=>k.startsWith(dispoAn));
  const charge=chargeParMois();
  const acteurs=state.acteurs.filter(a=>a.actif);

  const head = `<tr><th class="stick">Acteur — capacité en jours</th>${keys.map(k=>`<th>${monthLabel(k)}</th>`).join('')}<th>Total</th></tr>`;
  const rows = acteurs.map(a=>{
    let tot=0;
    const cells = keys.map(k=>{
      const pct=dispoPct(a.id,k);
      const cap=Math.max(0,Math.round((workdaysInMonth(k)*pct/100 - joursAbsence(a.id,k))*10)/10);
      const ch=charge[a.id+'|'+k]||0;
      tot+=cap;
      const ratio = cap>0? ch/cap*100 : (ch>0?999:0);
      const q = ratio>state.params.seuilSurcharge?'q0':ratio>80?'q1':ratio>0?'q3':'q2';
      const title=`${a.prenom} ${a.nom} — ${monthLabel(k)}\nDisponibilité ${pct}% · capacité ${cap} j · charge ${Math.round(ch*10)/10} j`;
      return `<td class="${q} ${ratio>state.params.seuilSurcharge?'over':''}" title="${esc(title)}">
        <input class="cell" data-a="${a.id}" data-k="${k}" value="${pct}" inputmode="numeric"></td>`;
    }).join('');
    return `<tr><td class="stick"><strong>${esc(a.prenom)} ${esc(a.nom)}</strong><div class="muted" style="font-size:10.5px">${esc(a.role)}</div></td>${cells}<td class="mono">${Math.round(tot)} j</td></tr>`;
  }).join('');
  const sumRow = `<tr class="sum"><td class="stick">Charge affectée (j)</td>${keys.map(k=>{
      const s=acteurs.reduce((x,a)=>x+(charge[a.id+'|'+k]||0),0);
      return `<td>${Math.round(s)}</td>`;}).join('')}<td>${Math.round(Object.values(charge).reduce((s,v)=>s+v,0))}</td></tr>`;

  $('#view-dispo').innerHTML=`
    <div class="card"><div class="card__body" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px">
      <span class="mono muted" style="font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">Année</span>
      <select id="dAn" style="width:130px"><option value="all">Toutes</option>${annees.map(y=>`<option value="${y}" ${dispoAn===y?'selected':''}>${y}</option>`).join('')}</select>

function initIO(){
  $('#btnSave').onclick=()=>{ commit().then(()=>toast('Modifications enregistrées')); };
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); commit().then(()=>toast('Modifications enregistrées')); }
  });
  window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  $('#btnExport').onclick=dialogExport;
  $('#btnImport').onclick=()=>$('#fileInput').click();
  $('#fileInput').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ const o=JSON.parse(r.result);
        if(!o.phases||!o.taches) throw 0;
        state=o; migrer(); normalizeStamps(); collapsed.clear(); if(PERSIST.mode==='cloud'){ resetCloud().then(()=>{render(); toast('Projet importé');}); } else { save(); render(); toast('Projet importé'); }

      e.target.value=''; };
    r.readAsText(f);
  };
}



/* ============================================================
   GANTT — construction des lignes et rendu (avec vue Jour)
   ============================================================ */
function lundi(s){ const d=s2d(s); return addDays(s, -((d.getDay()+6)%7)); }
let jourFocus = null, jourSemaines = 2, jourFiltre = true, ganttJalons = true;
function jalonsTransverses(){
  const J=[];
  (state.campagnes||[]).forEach(c=>{
    if(c.debut) J.push({date:c.debut,label:'Début '+c.nom,vue:'vunit',color:'#6B3FD4'});
    if(c.fin)   J.push({date:c.fin,  label:'Fin '+c.nom,  vue:'vunit',color:'#6B3FD4'}); });
  (state.boutEnBout||[]).forEach(b=>{ if(b.fin) J.push({date:b.fin,label:(b.ref?b.ref+' — ':'')+'bout-en-bout validé',vue:'vcomplete',color:'#DB6B12'}); });
  const parSerie={}; (state.repetitions||[]).forEach(r=>{ if(r.fin && (!parSerie[r.serie]||r.fin>parSerie[r.serie])) parSerie[r.serie]=r.fin; });
  Object.entries(parSerie).forEach(([serie,fin])=>J.push({date:fin,label:serie+' terminée',vue:'repetitions',color:'#0E86AD'}));
  const jj=(state.planBascule||[]).filter(e=>e.jour==='Jour J'&&e.debut).map(e=>e.debut).sort()[0];
  if(jj) J.push({date:jj,label:'Bascule — Jour J',vue:'planbascule',color:'#C6382F'});
  return J.sort((a,b)=>a.date.localeCompare(b.date));
}

function ganttRows(win){
  const rows=[];
  let vis=null;
  if(win && jourFiltre){
    vis=new Set();
    state.taches.forEach(t=>{
      const r=rollup(t);
      if(r.debut && r.debut<=win.fin && r.fin>=win.debut){
        vis.add(t.id); let p=t.parentId;
        while(p){ vis.add(p); p=(tacheById(p)||{}).parentId; }
      }
    });
  }
  state.phases.slice().sort((a,b)=>a.ordre-b.ordre).forEach(ph=>{
    if(filtrePhase!=='all' && filtrePhase!==ph.id) return;
    const span = phaseSpan(ph.id);
    const nbVis = vis ? state.taches.filter(t=>t.phaseId===ph.id&&vis.has(t.id)).length : 1;
    if(vis && !nbVis) return;
    rows.push({kind:'phase',phase:ph,span,code:String(ph.ordre),depth:0,id:'PH-'+ph.id});
    if(collapsed.has('PH-'+ph.id)) return;
    const walk=(pid,prefix,depth)=>{
      const kids = state.taches.filter(t=>t.phaseId===ph.id && t.parentId===pid);
      kids.sort((a,b)=>(a.debut||'').localeCompare(b.debut||''));
      let n=0;
      kids.forEach(t=>{
        n++;
        const code = prefix+'.'+n;
        if(vis && !vis.has(t.id)) return;
        const r = rollup(t);
        rows.push({kind:'tache',tache:t,code,depth,span:r,id:t.id,parent:estParent(t.id)});
        if(!collapsed.has(t.id)) walk(t.id,code,depth+1);
      });
    };
    walk(null,String(ph.ordre),1);
  });
  return rows;
}

function renderGantt(){
  const z = ZOOMS[state.params.zoom];
  const dayMode = state.params.zoom==='jour';
  if(dayMode && !jourFocus) jourFocus = lundi(today());

  const navSem = dayMode ? `
    <div class="daynav">
      <button class="btn btn--sm" id="gPrev" title="Semaine précédente">◀</button>
      <span class="daynav__lbl mono" id="gLbl"></span>
      <button class="btn btn--sm" id="gNext" title="Semaine suivante">▶</button>
      <select id="gNb" style="width:112px"><option value="1">1 semaine</option><option value="2">2 semaines</option><option value="4">4 semaines</option><option value="6">6 semaines</option></select>
      <label class="daynav__chk"><input type="checkbox" class="chk" id="gFil" ${jourFiltre?'checked':''}> Tâches de la période seulement</label>
    </div>` : '';

  $('#ganttToolbar').innerHTML = `
    <div class="seg" id="zoomSeg">${Object.entries(ZOOMS).map(([k,v])=>`<button data-z="${k}" class="${state.params.zoom===k?'is-active':''}">${v.lbl}</button>`).join('')}</div>
    ${navSem}
    <select id="fPhase" style="width:220px"><option value="all">Toutes les phases</option>${state.phases.map(p=>`<option value="${p.id}" ${filtrePhase===p.id?'selected':''}>${esc(p.nom)}</option>`).join('')}</select>
    <button class="btn" id="btnExpand">Tout déplier</button>
    <button class="btn" id="btnCollapse">Tout replier</button>
    <button class="btn ${ganttJalons?'is-on':''}" id="btnJalons" title="Afficher les jalons de validation et de bascule">◆ Jalons transverses</button>
    ${dayMode?'':'<button class="btn" id="btnToday">Aujourd\'hui</button>'}
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn" id="btnCsvWbs">Exporter en CSV</button>
      <button class="btn" id="btnNewJalon">Ajouter un jalon</button>
      <button class="btn btn--primary" id="btnNewTache">Ajouter une tâche</button>
    </div>`;

  const h = horizon();
  let start, end;
  if(dayMode){ start = jourFocus; end = addDays(start, jourSemaines*7-1); }
  else { start = addDays(h.debut,-7); end = addDays(h.fin,14); }
  const totalDays = diffDays(start,end)+1;
  const W = Math.round(totalDays*z.ppd);
  const x = s => Math.round(diffDays(start,s)*z.ppd);
  const clampL = v => Math.max(-4,v), clampR = v => Math.min(W+4,v);
  const win = dayMode ? {debut:start,fin:end} : null;
  const rows = ganttRows(win);
  const leftW = 430;

  $('#zoomSeg').onclick = e => { const b=e.target.closest('[data-z]'); if(b){ state.params.zoom=b.dataset.z; if(PERSIST.mode!=='cloud') save(); renderGantt(); } };
  $('#fPhase').onchange = e => { filtrePhase=e.target.value; renderGantt(); };
  $('#btnExpand').onclick = ()=>{ collapsed.clear(); renderGantt(); };
  $('#btnCollapse').onclick = ()=>{ state.phases.forEach(p=>collapsed.add('PH-'+p.id)); renderGantt(); };
  $('#btnNewTache').onclick = ()=> editTache(null,{});
  $('#btnNewJalon').onclick = ()=> editTache(null,{type:'jalon'});
  $('#btnCsvWbs').onclick = ()=> exportCSV('wbs');
  $('#btnJalons').onclick = ()=>{ ganttJalons=!ganttJalons; renderGantt(); };
  if(dayMode){
    $('#gLbl').textContent = `S${isoWeek(s2d(start))} · ${fmtFR(start)} → ${fmtFR(end)}`;
    $('#gNb').value = String(jourSemaines);
    $('#gPrev').onclick=()=>{ jourFocus=addDays(jourFocus,-7); renderGantt(); };
    $('#gNext').onclick=()=>{ jourFocus=addDays(jourFocus,7); renderGantt(); };
    $('#gNb').onchange=e=>{ jourSemaines=Number(e.target.value); renderGantt(); };
    $('#gFil').onchange=e=>{ jourFiltre=e.target.checked; renderGantt(); };
  }

  // ---------- en-têtes temporels ----------
  let major='', minor='', grid='';
  if(dayMode){
    let cur = start;
    while(cur <= end){
      const l=x(cur), d=s2d(cur);
      const fin=addDays(cur,6);
      major+=`<div class="g-tick g-tick--major" style="left:${l}px;width:${7*z.ppd}px">Semaine ${isoWeek(d)} · ${fmtFR(cur)} → ${fmtFR(fin)}</div>`;
      grid+=`<i class="major" style="left:${l}px"></i>`;
      for(let i=0;i<7;i++){
        const j=addDays(cur,i), dj=s2d(j), lj=x(j);
        const off=!isWorkday(dj);
        minor+=`<div class="g-tick g-tick--minor${off?' g-tick--off':''}" style="left:${lj}px;width:${z.ppd}px;text-align:center;padding-left:0">
          ${['D','L','M','M','J','V','S'][dj.getDay()]}<br><b>${dj.getDate()}</b></div>`;
        if(i) grid+=`<i style="left:${lj}px"></i>`;
        if(off) grid+=`<u style="left:${lj}px;width:${z.ppd}px"></u>`;
      }
      cur=addDays(cur,7);
    }
  } else if(state.params.zoom==='semaine'){
    monthsRange(start,end).forEach(k=>{
      const [y,m]=k.split('-').map(Number);
      const a=clampL(x(d2s(new Date(y,m-1,1)))), b=clampR(x(d2s(new Date(y,m,0)))+z.ppd);
      major+=`<div class="g-tick g-tick--major" style="left:${a}px;width:${b-a}px">${MOIS_L[m-1]} ${y}</div>`;
      grid+=`<i class="major" style="left:${a}px"></i>`;
    });
    let cur=lundi(start);
    while(cur<=end){
      const l=x(cur);
      minor+=`<div class="g-tick g-tick--minor" style="left:${l}px;width:${7*z.ppd}px">S${isoWeek(s2d(cur))}</div>`;
      grid+=`<i style="left:${l}px"></i><u style="left:${x(addDays(cur,5))}px;width:${2*z.ppd}px"></u>`;
      cur=addDays(cur,7);
    }
  } else {
    const years={}, trim = state.params.zoom==='trimestre';
    monthsRange(start,end).forEach(k=>{
      const [y,m]=k.split('-').map(Number);
      if(trim && (m-1)%3) return;
      const d0=new Date(y,m-1,1), d1= trim? new Date(y,m+2,0) : new Date(y,m,0);
      const a=clampL(x(d2s(d0))), b=clampR(x(d2s(d1))+z.ppd);
      minor+=`<div class="g-tick g-tick--minor" style="left:${a}px;width:${b-a}px">${trim?'T'+(Math.floor((m-1)/3)+1):MOIS[m-1]}</div>`;
      grid+=`<i style="left:${a}px"></i>`;
      if(!years[y]) years[y]={a:a,b:b};
      years[y].a=Math.min(years[y].a,a); years[y].b=Math.max(years[y].b,b);
    });
    Object.entries(years).forEach(([y,v])=>{
      major+=`<div class="g-tick g-tick--major" style="left:${v.a}px;width:${v.b-v.a}px">${y}</div>`;
      grid+=`<i class="major" style="left:${v.a}px"></i>`;
    });
  }

  // ---------- bandeau de phases ----------
  const ribbon = state.phases.slice().sort((a,b)=>a.ordre-b.ordre).map(p=>{
    const s=phaseSpan(p.id); if(!s) return '';
    if(s.fin<start || s.debut>end) return '';
    const a=Math.max(0,x(s.debut)), w=Math.max(2,Math.min(W,x(s.fin)+z.ppd)-a);
    return `<div class="g-phase" style="left:${a}px;width:${w}px;background:${p.couleur}" title="${esc(p.nom)} · ${fmtFR(s.debut)} → ${fmtFR(s.fin)}">${esc(p.nom)}</div>`;
  }).join('');

  // ---------- lignes ----------
  const rowsHTML = rows.map(r=>{
    const isPhase = r.kind==='phase';
    const t = r.tache, s = r.span;
    const hasKids = isPhase ? enfantsDePhase(r.phase.id).length>0 : r.parent;
    const col = isPhase ? r.phase.couleur : phaseById(t.phaseId).couleur;
    const nom = isPhase ? r.phase.nom : t.nom;
    const av = s? s.avancement||0 : 0;
    let barHTML='';
    if(s && s.debut && !(s.fin<start || s.debut>end)){
      const a=x(s.debut);
      if(!isPhase && t.type==='jalon'){
        barHTML = `<div class="ms" style="left:${a}px;background:${col}" data-id="${t.id}" data-role="bar"></div>
                   <div class="ms__lbl" style="left:${a+22}px">${esc(t.nom.length>44?t.nom.slice(0,44)+'…':t.nom)}</div>`;
      } else {
        const w=Math.max(3,x(s.fin)+z.ppd-a);
        const sum = isPhase || hasKids;
        barHTML = `<div class="bar${sum?' bar--sum':''}" style="left:${a}px;width:${w}px;background:${col};border-top-color:${col}"
            data-id="${isPhase?'':t.id}" data-role="bar" title="${esc(nom)} · ${fmtFR(s.debut)} → ${fmtFR(s.fin)} · ${av}%">
            ${sum?'':`<div class="bar__fill" style="width:${100-av}%;left:auto;right:0"></div>
            <div class="bar__grip bar__grip--l"></div><div class="bar__grip bar__grip--r"></div>`}
          </div>
          <div class="bar__lbl" style="left:${a+w}px">${av}%${!isPhase&&t.responsableId?' · '+esc(acteurNom(t.responsableId).split(' ')[0]):''}</div>`;
      }
    }
    const twist = hasKids ? `<button class="twist" data-tw="${r.id}">${collapsed.has(r.id)?'▶':'▼'}</button>` : '<span class="twist is-leaf"></span>';
    const meta = s&&s.debut ? `${fmtFR(s.debut)} → ${fmtFR(s.fin)}` : '';
    return `<div class="g-row${isPhase?' g-row--l1':''}${selTache===r.id?' is-sel':''}" data-row="${r.id}">
      <div class="g-row__left" style="padding-left:${6+r.depth*13}px">
        ${twist}<span class="dot" style="background:${col}"></span>
        <span class="wbs">${r.code}</span>
        <span class="g-name${!isPhase&&t.type==='jalon'?' g-name--milestone':''}">${esc(nom)}</span>
        <span class="g-meta">${meta}</span>
        ${isPhase?'':`<button class="rowbtn" data-edit="${t.id}" title="Modifier">✎</button><button class="rowbtn" data-sub="${t.id}" title="Ajouter une sous-tâche">＋</button>`}
      </div>
      <div class="g-row__time" style="width:${W}px">${barHTML}</div>
    </div>`;
  }).join('');

  const tX = (today()>=start && today()<=end) ? x(today()) : -1;
  const bodyH = Math.max(rows.length*32, 60);
  $('#ganttInner').innerHTML = `
    <div style="--leftw:${leftW}px;width:${leftW+W}px">
      <div class="g-head">
        <div class="g-head__left">Décomposition (WBS)</div>
        <div class="g-head__time${dayMode?' g-head__time--day':''}" style="width:${W}px">${major}${minor}</div>
      </div>
      <div class="g-ribbon" style="width:${leftW+W}px">
        <div class="g-ribbon__left">Phases</div>
        <div style="position:absolute;left:${leftW}px;top:0;width:${W}px;height:100%">${ribbon}</div>
      </div>
      ${(() => {
        const JT = ganttJalons ? jalonsTransverses().filter(j=>j.date>=start && j.date<=end) : [];
        if(!JT.length) return '';
        const band = JT.map((j,i)=>`<div class="g-jalon" style="left:${x(j.date)}px" title="${esc(j.label)} · ${fmtFR(j.date)}" data-jgoto="${j.vue}">
            <span class="g-jalon__d" style="background:${j.color}"></span>
            <span class="g-jalon__l ${i%2?'dn':'up'}" style="color:${j.color}">${esc(j.label.length>34?j.label.slice(0,34)+'…':j.label)}</span></div>`).join('');
        return `<div class="g-mrow" style="width:${leftW+W}px">
          <div class="g-ribbon__left">Jalons</div>
          <div class="g-mrow__t" style="left:${leftW}px;width:${W}px">${band}</div></div>`;
      })()}
      <div class="g-body" id="gBody">
        <div class="g-grid" style="left:${leftW}px;width:${W}px;height:${bodyH}px">${grid}</div>
        ${tX>=0?`<div class="g-today" style="left:${leftW+tX}px;height:${bodyH}px"></div>`:''}
        <svg class="g-links" id="gLinks" width="${leftW+W}" height="${bodyH}"></svg>
        ${rowsHTML || '<div class="action-empty">Aucune tâche sur cette période.</div>'}
      </div>
    </div>`;

  drawLinks(rows,x,z,leftW);
  wireGantt(rows,start,z);
  $('#ganttInner').querySelectorAll('[data-jgoto]').forEach(b=>b.onclick=()=>go(b.dataset.jgoto));
  const sc=$('#ganttScroll');
  if(!dayMode){
    const goToday=()=>{ if(tX>=0) sc.scrollLeft = Math.max(0, tX - sc.clientWidth/3); };
    const bt=$('#btnToday'); if(bt) bt.onclick=goToday;
    if(!sc.dataset.init){ sc.dataset.init='1'; goToday(); }
  }
}

function csvCell(v){
  const s = v===null||v===undefined ? '' : String(v);
  return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCSV(nom, entetes, lignes){
  const txt = '\ufeff' + [entetes, ...lignes].map(r=>r.map(csvCell).join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=(state.projet.code||'projet')+'-'+nom+'-'+today()+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Fichier CSV exporté');
}
const JEUX = {
  wbs:{nom:'Décomposition WBS', build(){
    const rows=[]; 
    state.phases.slice().sort((a,b)=>a.ordre-b.ordre).forEach(ph=>{
      const walk=(pid,prefix,niv)=>{
        state.taches.filter(t=>t.phaseId===ph.id&&t.parentId===pid)
          .sort((a,b)=>(a.debut||'').localeCompare(b.debut||'')).forEach((t,i)=>{
          const code=prefix+'.'+(i+1), r=rollup(t);
          rows.push([code,niv,ph.nom,t.nom,t.type==='jalon'?'Jalon':'Tâche',r.debut,r.fin,
            workdaysBetween(r.debut,r.fin),r.charge,r.avancement,statutDef(t.statut).nom,acteurNom(t.responsableId),
            (t.dependances||[]).map(d=>(tacheById(d)||{}).nom).join(' / '),t.note||'']);
          walk(t.id,code,niv+1);
        });
      };
      const s=phaseSpan(ph.id);
      rows.push([String(ph.ordre),0,ph.nom,ph.nom,'Phase',s?s.debut:'',s?s.fin:'',s?workdaysBetween(s.debut,s.fin):'','',s?s.avancement:'','','','','']);
      walk(null,String(ph.ordre),1);
    });
    return {entetes:['Code WBS','Niveau','Phase','Libellé','Type','Début','Fin','Jours ouvrés','Charge (j)','Avancement (%)','Statut','Responsable','Prédécesseurs','Notes'],lignes:rows};
  }},
  actions:{nom:'Plan d\'action', build(){
    const sec=id=>(state.sections.find(s=>s.id===id)||{}).nom||'';
    return {entetes:['Section','Action','Détail','Responsable','Échéance','Statut','Priorité','Avancement (%)','Tâche WBS liée','Créée le'],
      lignes:state.actions.map(a=>[sec(a.sectionId),a.titre,a.detail||'',acteurNom(a.responsableId),a.echeance||'',
        statutDef(a.statut).nom,(PRIORITES.find(p=>p.id===a.priorite)||{}).nom||'',a.avancement||0,
        a.tacheId?(tacheById(a.tacheId)||{}).nom||'':'',a.creeLe||''])};
  }},
  acteurs:{nom:'Acteurs', build(){
    const ch=chargeParMois(); const tot={};
    Object.entries(ch).forEach(([k,v])=>{const a=k.split('|')[0];tot[a]=(tot[a]||0)+v;});
    return {entetes:['Prénom','Nom','Rôle','Organisation','Courriel','TJM','Disponibilité par défaut (%)','Charge affectée (j)','Coût estimé','Statut'],
      lignes:state.acteurs.map(a=>[a.prenom,a.nom,a.role,a.organisation,a.email,a.tjm,a.dispoDefaut,
        Math.round(tot[a.id]||0),Math.round((tot[a.id]||0)*a.tjm),a.actif?'Actif':'Inactif'])};
  }},
  dispos:{nom:'Disponibilités', build(){
    const h=horizon(), keys=monthsRange(h.debut,h.fin), ch=chargeParMois();
    const lignes=[];
    state.acteurs.forEach(a=>{
      lignes.push([a.prenom+' '+a.nom,a.role,'Disponibilité (%)',...keys.map(k=>dispoPct(a.id,k))]);
      lignes.push([a.prenom+' '+a.nom,a.role,'Capacité (j)',...keys.map(k=>Math.max(0,Math.round((workdaysInMonth(k)*dispoPct(a.id,k)/100-joursAbsence(a.id,k))*10)/10))]);
      lignes.push([a.prenom+' '+a.nom,a.role,'Charge affectée (j)',...keys.map(k=>Math.round((ch[a.id+'|'+k]||0)*10)/10)]);
    });
    return {entetes:['Acteur','Rôle','Mesure',...keys.map(monthLabel)],lignes};
  }},
  systemes:{nom:'Systèmes et bases', build(){
    return {entetes:['Système','Éditeur','Domaine couvert','Base concernée','SGBD','Environnement','Criticité','Volumétrie','Interface avec l\'ERP','Devenir','Responsable','Commentaire'],
      lignes:state.systemes.map(s=>[s.nom,s.editeur,s.domaine,s.base,s.sgbd,s.environnement,s.criticite,s.volumetrie,
        s.interface?'Oui':'Non',s.devenir,acteurNom(s.responsableId),s.commentaire||''])};
  }},
  perimetre:{nom:'Périmètre solution', build(){
    const dom=id=>(state.domaines.find(d=>d.id===id)||{}).nom||'';
    return {entetes:['Domaine métier','Code','Processus niveau 1','Statut de validation','Couverture','Criticité','Responsable','Atelier','Commentaire'],
      lignes:state.processus.map(p=>[dom(p.domaineId),p.code,p.nom,VALID.find(v=>v.id===p.statut).nom,p.couverture,
        p.criticite,acteurNom(p.responsableId),p.atelier||'',p.commentaire||''])};
  }},
  transformations:{nom:'Transformations', build(){
    const dom=id=>(state.domaines.find(d=>d.id===id)||{}).nom||'';
    return {entetes:['Domaine','Transformation','Nature','Impact','Population concernée','Effectif','Levier d\'accompagnement','Statut','Responsable','Échéance','Description'],
      lignes:state.transformations.map(t=>[dom(t.domaineId),t.titre,t.nature,t.impact,t.population,t.effectif,
        t.accompagnement,statutDef(t.statut).nom,acteurNom(t.responsableId),t.echeance||'',t.description||''])};
  }},
  formations:{nom:'Plan de formation', build(){
    const dom=id=>(state.domaines.find(d=>d.id===id)||{}).nom||'';
    return {entetes:['Module','Domaine','Public cible','Format','Durée (h)','Effectif','Sessions','Formateur','Période','Supports (%)','Statut','Personnes formées'],
      lignes:state.formations.map(f=>[f.module,dom(f.domaineId),f.public,f.format,f.duree,f.effectif,f.sessions,
        acteurNom(f.formateurId),f.periode,f.supports,statutDef(f.statut).nom,f.formes||0])};
  }}
};

const VALID=[
  {id:'non',   nom:'Non démarré',      poids:0,   cls:'v-non'},
  {id:'atelier',nom:'Atelier en cours',poids:30,  cls:'v-atelier'},
  {id:'arbitrage',nom:'En arbitrage',  poids:60,  cls:'v-arb'},
  {id:'metier',nom:'Validé métier',    poids:85,  cls:'v-metier'},
  {id:'copil', nom:'Validé COPIL',     poids:100, cls:'v-copil'},
  {id:'hors',  nom:'Hors périmètre',   poids:null,cls:'v-hors'}
];
const COUVERTURES=['Standard','Paramétrage','Spécifique','Interface','Non couvert','À qualifier'];
const validDef=id=>VALID.find(v=>v.id===id)||VALID[0];
function avancementDomaine(dId){
  const ps=state.processus.filter(p=>p.domaineId===dId && p.statut!=='hors');
  if(!ps.length) return 0;
  return Math.round(ps.reduce((s,p)=>s+validDef(p.statut).poids,0)/ps.length);
}

  const ps=state.processus.filter(p=>p.statut!=='hors');
  const global = ps.length? Math.round(ps.reduce((s,p)=>s+validDef(p.statut).poids,0)/ps.length):0;
  const cpt = id => state.processus.filter(p=>p.statut===id).length;

    ['Validation de la solution', global+' %', `${state.processus.length} processus niveau 1`],

    ['Spécifiques identifiés', String(state.processus.filter(p=>p.couverture==='Spécifique').length), 'à chiffrer et à justifier'],
