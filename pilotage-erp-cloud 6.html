      <button class="btn btn--sm brick__add" data-addproc="${d.id}">Ajouter un processus</button>
    </div>`;
  }).join('');

  $('#view-perimetre').innerHTML=`

/* ============================================================
   HORODATAGE — date de modification sur chaque élément
   ============================================================ */
const nowStamp = () => new Date().toISOString();
function fmtDT(iso){ if(!iso) return '—'; const d=new Date(iso);
  return String(d.getDate()).padStart(2,'0')+' '+MOIS[d.getMonth()]+' '+String(d.getFullYear()).slice(2)+
    ' · '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function depuisJours(iso){ if(!iso) return null; return Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/DAY)); }
function depuisTxt(iso){ const j=depuisJours(iso); if(j===null) return '—'; if(j===0) return "aujourd'hui"; if(j===1) return 'hier'; if(j<31) return 'depuis '+j+' j'; const m=Math.floor(j/30); return 'depuis '+m+' mois'; }
const STAT_DONE = new Set(['fait']);
const optDomaines = sel => state.domaines.map(d=>`<option value="${d.id}" ${sel===d.id?'selected':''}>${esc(d.nom)}</option>`).join('');

const regUI = {};        // état transitoire (recherche, filtre) par registre
function regList(cfg){ return state[cfg.store] || (state[cfg.store]=[]); }
function regUIState(cfg){ return regUI[cfg.store] || (regUI[cfg.store]={q:'',grp:'all'}); }

function fieldValue(f,row){ return row? row[f.k] : (f.def!==undefined?f.def:(f.type==='bool'?false:(f.type==='number'?0:''))); }

function refName(f,v){ const arr=state[f.refStore]||[]; const o=arr.find(x=>x.id===v); return o?(o[f.refLabel||'nom']||''):''; }
function cellRender(f,v,row,cfg){
  if(v===undefined||v===null||v==='') { if(f.type==='bool') v=false; else return '<span class="muted">—</span>'; }
  switch(f.type){
    case 'acteur': return esc(acteurNom(v));
    case 'domaine': { const d=state.domaines.find(x=>x.id===v); return d?`<span class="tag" style="color:${d.couleur}">${esc(d.nom)}</span>`:'<span class="muted">—</span>'; }
    case 'ref': { const n=refName(f,v)||row[f.fallback]||''; return n?`<span class="tag tag--ref">${esc(n)}</span>`:'<span class="muted">—</span>'; }
    case 'statut': { const s=statutDef(v); const done=STAT_DONE.has(v); return `<span class="tag ${s.cls}">${s.nom}</span>`; }
    case 'bool': return v?'<span class="tag tag--run">Oui</span>':'<span class="tag tag--todo">Non</span>';
    case 'date': { const done=cfg.statutKey && STAT_DONE.has(row[cfg.statutKey]); const late=!done && v<today();
      return `<span class="mono ${late?'overdue':''}">${fmtFR(v)}</span>`; }
    case 'money': return `<span class="num mono">${Number(v).toLocaleString('fr-FR')} ${state.params.devise}</span>`;
    case 'number': return `<span class="num mono">${v}</span>`;
    case 'pct': return `<div style="display:flex;align-items:center;gap:6px;min-width:90px"><div class="prog" style="flex:1"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div><span class="mono" style="font-size:11px">${v}%</span></div>`;
    case 'select': return f.tag!==false?`<span class="tag">${esc(v)}</span>`:esc(v);
    case 'textarea': return `<span title="${esc(v)}">${esc(String(v).length>70?String(v).slice(0,70)+'…':v)}</span>`;
    default: return esc(v);
  }
}

function fieldInput(f,val){
  const id='rf_'+f.k;
  const req=f.required?'':'';
  if(f.type==='textarea') return `<textarea id="${id}">${esc(val||'')}</textarea>`;
  if(f.type==='select'){ const opts=(typeof f.options==='function'?f.options():f.options)||[];
    return `<select id="${id}">${f.optional?'<option value="">— —</option>':''}${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${val===v?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`; }
  if(f.type==='acteur') return `<select id="${id}">${optActeurs(val)}</select>`;
  if(f.type==='domaine') return `<select id="${id}">${f.optional?'<option value="">— Transverse —</option>':''}${optDomaines(val)}</select>`;
  if(f.type==='ref'){ const arr=state[f.refStore]||[]; return `<select id="${id}">${f.optional?'<option value="">— —</option>':''}${arr.slice().sort((a,b)=>(a[f.refLabel||'nom']||'').localeCompare(b[f.refLabel||'nom']||'')).map(o=>`<option value="${o.id}" ${val===o.id?'selected':''}>${esc(o[f.refLabel||'nom']||'')}</option>`).join('')}</select>`; }
  if(f.type==='statut') return `<select id="${id}">${optStatuts(val||'na')}</select>`;
  if(f.type==='bool') return `<select id="${id}"><option value="1" ${val?'selected':''}>Oui</option><option value="0" ${val?'':'selected'}>Non</option></select>`;
  if(f.type==='date') return `<input type="date" id="${id}" value="${val||''}">`;
  if(f.type==='color') return `<input type="color" id="${id}" value="${val||'#3C63E0'}" style="height:30px;padding:1px">`;
  if(f.type==='number'||f.type==='money'||f.type==='pct') return `<input type="number" id="${id}" value="${val??0}" ${f.min!==undefined?`min="${f.min}"`:'min="0"'} ${f.max!==undefined?`max="${f.max}"`:''} step="${f.step||(f.type==='money'?'100':'1')}">`;
  return `<input type="text" id="${id}" value="${esc(val||'')}" ${f.list?`list="dl_${f.k}"`:''} placeholder="${esc(f.ph||'')}">`+
    (f.list?`<datalist id="dl_${f.k}">${[...new Set(regList(REG[f.list]||{store:f.list}).map(x=>x[f.k]).filter(Boolean))].map(v=>`<option>${esc(v)}</option>`).join('')}</datalist>`:'');
}

function editRegItem(cfg,id,defaults={}){
  const list=regList(cfg);
  const row = id? list.find(x=>x.id===id) : {...Object.fromEntries(cfg.champs.map(f=>[f.k,fieldValue(f,null)])),...defaults};
  const corps = `<div class="regform">${cfg.champs.map(f=>
    `<label class="f ${f.full||f.type==='textarea'?'full':''}"><span>${esc(f.label)}${f.required?' *':''}</span>${fieldInput(f,row[f.k])}</label>`).join('')}
    ${id?`<p class="hint full" style="margin:2px 0 0">Dernière modification : ${fmtDT(row.maj)}${row.creeLe?' · créé le '+fmtFR(row.creeLe):''}</p>`:''}</div>`;
  modal({titre:(id?'Modifier — ':'Nouveau — ')+cfg.single, corps,
    extra:id?`<button class="btn btn--danger left" id="reg_del">Supprimer</button>`:'',
    onOk(r){
      const o={};
      for(const f of cfg.champs){
        const el=$('#rf_'+f.k,r); if(!el) continue;
        let v=el.value;
        if(f.type==='number'||f.type==='money'||f.type==='pct') v=Number(v)||0;
        else if(f.type==='bool') v=v==='1';
        else if(f.type==='acteur'||f.type==='domaine'||f.type==='ref') v=v||null;
        else if(typeof v==='string') v=v.trim();
        o[f.k]=v;
      }
      const first=cfg.champs.find(f=>f.required);
      if(first && !o[first.k]){ toast('Le champ « '+first.label+' » est obligatoire.'); return false; }
      o.maj=nowStamp();
      let target; const isNew=!id;
      if(id){
        if(cfg.respKey && o[cfg.respKey] && o[cfg.respKey]!==row[cfg.respKey]) o.assigneLe=nowStamp();
        target=Object.assign({}, row, o);
      } else {
        o.creeLe=today(); if(cfg.respKey && o[cfg.respKey]) o.assigneLe=nowStamp();
        target=Object.assign({ id: uid(cfg.prefix||'r') }, o);
      }
      regCommit(cfg, target, isNew);
      return false;
    }});
  if(id) $('#reg_del').onclick=async ()=>{
    try{ await PERSIST.deleteItem(cfg.store, id); $('#modalRoot').innerHTML=''; render(); toast('Élément supprimé'); }
    catch(e){ handleWriteError(e, cfg.store, id); }
  };
}

function registerBlock(cfg,opts={}){
  const ui=regUIState(cfg);
  let items=regList(cfg).slice();
  if(opts.filter) items=items.filter(opts.filter);
  if(ui.q){ const q=ui.q.toLowerCase(); items=items.filter(r=>cfg.champs.some(f=>['text','textarea','select'].includes(f.type)&&String(r[f.k]||'').toLowerCase().includes(q))); }
  if(cfg.groupBy && ui.grp!=='all') items=items.filter(r=>r[cfg.groupBy]===ui.grp);
  if(cfg.sort) items.sort(cfg.sort); else if(cfg.statutKey) items.sort((a,b)=>(a[cfg.orderKey||'maj']||'').localeCompare(b[cfg.orderKey||'maj']||''));
  const cols=cfg.champs.filter(f=>!f.hideCol);
  const grpField = cfg.groupBy? cfg.champs.find(f=>f.k===cfg.groupBy) : null;
  const grpLabelOf = v => { if(grpField&&grpField.type==='ref') return refName(grpField,v)||v;
    if(grpField&&grpField.type==='domaine'){ const d=state.domaines.find(x=>x.id===v); return d?d.nom:v; } return v; };
  const grpVals = cfg.groupBy? [...new Set(regList(cfg).map(r=>r[cfg.groupBy]).filter(Boolean))] : null;
  const toolbar=`<div class="card"><div class="card__body" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px">
      <input type="text" id="reg_q" value="${esc(ui.q)}" placeholder="Rechercher…" style="width:220px">
      ${grpVals?`<select id="reg_grp" style="width:210px"><option value="all">${esc(cfg.groupLabel||'Tout')}</option>${grpVals.map(v=>`<option value="${esc(v)}" ${ui.grp===v?'selected':''}>${esc(grpLabelOf(v))}</option>`).join('')}</select>`:''}
      ${opts.toolbarExtra||''}
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn" data-reg-csv>Exporter en CSV</button>
        <button class="btn btn--primary" data-reg-add>${esc(cfg.addLabel||'Ajouter')}</button></div>
    </div></div>`;
  const table = items.length? `<div class="card"><table class="tbl"><thead><tr>
      ${cols.map(f=>`<th class="${['number','money','pct'].includes(f.type)?'num':''}" ${f.w?`style="width:${f.w}"`:''}>${esc(f.label)}</th>`).join('')}
      <th style="width:118px">Modifié le</th><th style="width:40px"></th></tr></thead>
    <tbody>${items.map(r=>`<tr>
      ${cols.map(f=>`<td class="${['number','money','pct'].includes(f.type)?'num':''}">${f.main?'<strong>'+cellRender(f,r[f.k],r,cfg)+'</strong>':cellRender(f,r[f.k],r,cfg)}</td>`).join('')}
      <td class="mono muted" style="font-size:10.5px">${fmtDT(r.maj)}</td>
      <td><button class="btn btn--sm btn--ghost" data-reg-ed="${r.id}">✎</button></td></tr>`).join('')}</tbody></table></div>`
    : `<div class="card"><div class="card__body muted">${esc(opts.empty||'Aucun élément. Ajoutez le premier pour lancer le suivi.')}</div></div>`;
  return toolbar+table;
}
function wireRegister(cfg,rootSel,opts={}){
  const root=$(rootSel);
  const q=$('#reg_q',root); if(q) q.oninput=e=>{ regUIState(cfg).q=e.target.value; renderRegister(cfg,rootSel,opts); const n=$('#reg_q',root); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);} };
  const g=$('#reg_grp',root); if(g) g.onchange=e=>{ regUIState(cfg).grp=e.target.value; renderRegister(cfg,rootSel,opts); };
  root.querySelectorAll('[data-reg-add]').forEach(b=>b.onclick=()=>editRegItem(cfg,null,opts.addDefaults||{}));
  root.querySelectorAll('[data-reg-csv]').forEach(b=>b.onclick=()=>exportRegisterCSV(cfg,opts.filter));
  root.querySelectorAll('[data-reg-ed]').forEach(b=>b.onclick=()=>editRegItem(cfg,b.dataset.regEd));
}
function renderRegister(cfg,mountSel,opts={}){ $(mountSel).innerHTML=registerBlock(cfg,opts); wireRegister(cfg,mountSel,opts); }
function exportRegisterCSV(cfg,filter){
  let items=regList(cfg).slice(); if(filter) items=items.filter(filter);
  const cols=cfg.champs;
  const val=(f,r)=>{ const v=r[f.k];
    if(f.type==='acteur') return acteurNom(v);
    if(f.type==='domaine'){ const d=state.domaines.find(x=>x.id===v); return d?d.nom:''; }
    if(f.type==='ref') return refName(f,v)||r[f.fallback]||'';
    if(f.type==='statut') return statutDef(v).nom;
    if(f.type==='bool') return v?'Oui':'Non';
    return v??''; };
  downloadCSV(cfg.store, [...cols.map(f=>f.label),'Modifié le','Créé le'],
    items.map(r=>[...cols.map(f=>val(f,r)), r.maj?fmtDT(r.maj):'', r.creeLe||'']));
}

/* ============================================================
   MINI-GANTT (mois) — réutilisé par bascule, formation, bout-en-bout
   ============================================================ */
function miniGantt(groups){
  const all=[]; groups.forEach(g=>g.rows.forEach(r=>{ if(r.debut) all.push(r.debut); if(r.fin) all.push(r.fin); }));
  if(!all.length) return '<div class="card"><div class="card__body muted">Renseignez des dates pour afficher le planning.</div></div>';
  const start=addDays(all.sort()[0],-3), end=addDays(all.sort().slice(-1)[0],3);
  const keys=monthsRange(start,end), ppd=3.0, W=Math.round((diffDays(start,end)+1)*ppd), L=250;
  const x=s=>Math.round(diffDays(start,s)*ppd);
  let months='',grid='';
  keys.forEach(k=>{ const [y,m]=k.split('-').map(Number); const a=x(d2s(new Date(y,m-1,1)));
    months+=`<div class="mg-tick" style="left:${a}px">${MOIS[m-1]} ${String(y).slice(2)}</div>`; grid+=`<i style="left:${a}px"></i>`; });
  const tX=(today()>=start&&today()<=end)?x(today()):-1;
  let rowsH='',rowN=0;
  groups.forEach(g=>{
    rowsH+=`<div class="mg-row mg-row--grp"><div class="mg-row__l">${esc(g.titre)}</div><div class="mg-row__t" style="width:${W}px"></div></div>`; rowN++;
    g.rows.forEach(r=>{
      const a=r.debut?x(r.debut):0, w=r.debut&&r.fin?Math.max(4,x(r.fin)+ppd-a):6;
      const st=r.statut?statutDef(r.statut):null;
      const bar=r.debut?`<div class="mg-bar" style="left:${a}px;width:${w}px;background:${g.couleur||'#3C63E0'}" title="${esc(r.nom)} · ${fmtFR(r.debut)} → ${fmtFR(r.fin)}"></div>
        <div class="mg-lbl" style="left:${a+w}px">${st?st.nom:''}${r.resp?' · '+esc(r.resp):''}</div>`:'';
      rowsH+=`<div class="mg-row"><div class="mg-row__l" style="padding-left:20px">${esc(r.nom)}</div><div class="mg-row__t" style="width:${W}px">${bar}</div></div>`; rowN++;
    });
  });
  return `<div class="card" style="overflow:hidden"><div class="mg" style="--mgl:${L}px">
    <div class="mg-head"><div class="mg-head__l">Actions</div><div class="mg-head__t" style="width:${W}px">${months}</div></div>
    <div class="mg-body">
      <div class="mg-grid" style="left:${L}px;width:${W}px;height:${rowN*26}px">${grid}</div>
      ${tX>=0?`<div class="mg-today" style="left:${L+tX}px;height:${rowN*26}px"></div>`:''}
      ${rowsH}
    </div></div></div>`;
}

/* ============================================================
   TABLEAU DE BORD — collecte des éléments attribués
   ============================================================ */
function collectItems(){
  const out=[];
  const push=(o)=>out.push(o);
  state.taches.filter(t=>t.responsableId&&!estParent(t.id)).forEach(t=>{const r=rollup(t);
    push({type:t.type==='jalon'?'Jalon':'Tâche projet',vue:'gantt',titre:t.nom,responsableId:t.responsableId,
      echeance:r.fin,criticite:t.type==='jalon'?'Critique':'Majeur',statut:t.statut,assigneLe:t.maj||t.creeLe,domaineId:null,phaseId:t.phaseId});});
  state.actions.forEach(a=>push({type:"Action du plan",vue:'plan',titre:a.titre,responsableId:a.responsableId,
    echeance:a.echeance,criticite:({h:'Critique',m:'Majeur',b:'Mineur'})[a.priorite]||'Majeur',statut:a.statut,assigneLe:a.assigneLe||a.creeLe,domaineId:null}));
  state.transformations.forEach(t=>push({type:"Impact organisation",vue:'transfo',titre:t.titre,responsableId:t.responsableId,
    echeance:t.echeance,criticite:({Fort:'Critique',Moyen:'Majeur',Faible:'Mineur'})[t.impact]||'Majeur',statut:t.statut,assigneLe:t.maj,domaineId:t.domaineId}));
  state.processus.forEach(p=>push({type:"Processus à valider",vue:'perimetre',titre:p.code+' · '+p.nom,responsableId:p.responsableId,
    echeance:null,criticite:p.criticite,statut:p.statut==='copil'||p.statut==='metier'?'fait':(p.statut==='non'||p.statut==='hors'?'na':'cours'),assigneLe:p.maj,domaineId:p.domaineId}));
  (state.demandes||[]).forEach(d=>push({type:"Demande",vue:'demandes',titre:d.titre,responsableId:d.responsableId,
    echeance:d.echeance,criticite:d.criticite,statut:d.statut,assigneLe:d.assigneLe||d.creeLe,domaineId:d.domaineId}));
  (state.roles||[]).forEach(r=>push({type:"Rôle de sécurité",vue:'roles',titre:r.nom,responsableId:r.responsableId,
    echeance:null,criticite:r.criticite||'Majeur',statut:r.statut,assigneLe:r.maj,domaineId:r.domaineId}));
  (state.bascule||[]).forEach(b=>push({type:"Action de bascule",vue:'bascule',titre:b.action,responsableId:b.responsableId,
    echeance:b.fin,criticite:'Majeur',statut:b.statut,assigneLe:b.maj,domaineId:null}));
  (state.realisation||[]).forEach(x=>push({type:"Réalisation",vue:'real',titre:x.titre,responsableId:x.responsableId,
    echeance:x.echeance,criticite:x.criticite||'Majeur',statut:x.statut,assigneLe:x.maj,domaineId:x.domaineId}));
  return out;
}

• Chaque anomalie est qualifiée : bloquante, majeure ou mineure. Le passage en recette suivante exige zéro anomalie bloquante.`;

let tdbScope={mode:'indiv',acteurId:null,domaineId:null};
function renderTDB(){
  if(!tdbScope.acteurId) tdbScope.acteurId=(state.acteurs.find(a=>a.actif)||{}).id;
  if(!tdbScope.domaineId) tdbScope.domaineId=(state.domaines[0]||{}).id;
  let items=collectItems();
  let titrePerimetre='';
  if(tdbScope.mode==='indiv'){ items=items.filter(i=>i.responsableId===tdbScope.acteurId); titrePerimetre=acteurNom(tdbScope.acteurId); }
  else if(tdbScope.mode==='domaine'){ items=items.filter(i=>i.domaineId===tdbScope.domaineId); titrePerimetre=(state.domaines.find(d=>d.id===tdbScope.domaineId)||{}).nom||''; }
  else titrePerimetre='Projet complet';
  const ouverts=items.filter(i=>!STAT_DONE.has(i.statut));
  const retard=ouverts.filter(i=>i.echeance&&i.echeance<today());
  const critiques=ouverts.filter(i=>i.criticite==='Critique');
  const kpis=[
    ['Éléments attribués',String(items.length),titrePerimetre],
    ['En cours ou à faire',String(ouverts.length),`${items.length-ouverts.length} terminés`],
    ['En retard',String(retard.length),retard.length?'échéance dépassée':'aucun'],
    ['Critiques ouverts',String(critiques.length),'à sécuriser en priorité']
  ];
  const scopeBar=`<div class="card"><div class="card__body" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px">
      <div class="seg" id="tdb_seg">${[['indiv','Individuel'],['domaine','Par domaine'],['projet','Projet']].map(([k,l])=>`<button data-m="${k}" class="${tdbScope.mode===k?'is-active':''}">${l}</button>`).join('')}</div>
      ${tdbScope.mode==='indiv'?`<select id="tdb_ac" style="width:220px">${state.acteurs.map(a=>`<option value="${a.id}" ${tdbScope.acteurId===a.id?'selected':''}>${esc(a.prenom+' '+a.nom)}</option>`).join('')}</select>`:''}
      ${tdbScope.mode==='domaine'?`<select id="tdb_do" style="width:240px">${state.domaines.map(d=>`<option value="${d.id}" ${tdbScope.domaineId===d.id?'selected':''}>${esc(d.nom)}</option>`).join('')}</select>`:''}
      <span class="hint" style="margin:0 0 0 auto">La durée d'attribution part de la dernière modification connue de l'élément.</span>
    </div></div>`;
  // regroupement par type puis par criticité
  const parType={}; items.forEach(i=>{(parType[i.type]=parType[i.type]||[]).push(i);});
  const critOrder={Critique:0,Majeur:1,Mineur:2};
  const tableFor=list=>`<table class="tbl"><thead><tr><th>Élément</th><th style="width:110px">Criticité</th>
      <th style="width:112px">Statut</th><th style="width:130px">Attribué</th><th style="width:104px">Échéance</th><th style="width:60px"></th></tr></thead>
    <tbody>${list.sort((a,b)=>(critOrder[a.criticite]??9)-(critOrder[b.criticite]??9)||(a.echeance||'9').localeCompare(b.echeance||'9')).map(i=>{
      const late=!STAT_DONE.has(i.statut)&&i.echeance&&i.echeance<today();
      return `<tr><td>${esc(i.titre)}</td>
        <td><span class="tag ${i.criticite==='Critique'?'tag--late':i.criticite==='Majeur'?'tag--run':'tag--todo'}">${esc(i.criticite)}</span></td>
        <td><span class="tag ${statutDef(i.statut).cls}">${statutDef(i.statut).nom}</span></td>
        <td class="mono muted" style="font-size:11px">${depuisTxt(i.assigneLe)}</td>
        <td class="mono ${late?'overdue':''}">${fmtFR(i.echeance)}</td>
        <td><button class="btn btn--sm btn--ghost" data-goto="${i.vue}">Ouvrir</button></td></tr>`;}).join('')}</tbody></table>`;
  const blocs=Object.keys(parType).sort().map(t=>`<div class="section">
      <div class="section__head"><h3>${esc(t)}</h3><span class="section__count">${parType[t].length} · ${parType[t].filter(i=>i.criticite==='Critique').length} critiques</span></div>
      ${tableFor(parType[t])}</div>`).join('');
  $('#view-tdb').innerHTML=`<div class="kpis">${kpis.map(k=>`<div class="kpi"><div class="kpi__k">${k[0]}</div><div class="kpi__v">${esc(k[1])}</div><div class="kpi__n">${esc(k[2])}</div></div>`).join('')}</div>
    ${scopeBar}${blocs||'<div class="card"><div class="card__body muted">Aucun élément attribué sur ce périmètre.</div></div>'}`;
  $('#tdb_seg').onclick=e=>{const b=e.target.closest('[data-m]');if(b){tdbScope.mode=b.dataset.m;renderTDB();}};
  const ac=$('#tdb_ac'); if(ac) ac.onchange=e=>{tdbScope.acteurId=e.target.value;renderTDB();};
  const dsel=$('#tdb_do'); if(dsel) dsel.onchange=e=>{tdbScope.domaineId=e.target.value;renderTDB();};
  $('#view-tdb').querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));
}

const subtabState={};
function subtabView(viewId,key,tabs){
  const cur = subtabState[key] || tabs[0].id;
  subtabState[key]=cur;
  const root=$('#'+viewId);
  root.innerHTML=`<div class="subtabs">${tabs.map(t=>`<button class="subtab${t.id===cur?' is-active':''}" data-st="${t.id}">${esc(t.nom)}</button>`).join('')}</div>
    <div class="subtab-body" id="${viewId}-body"></div>`;
  root.querySelector('.subtabs').onclick=e=>{ const b=e.target.closest('[data-st]'); if(b){ subtabState[key]=b.dataset.st; subtabView(viewId,key,tabs); } };
  const active=tabs.find(t=>t.id===cur);
  if(active.run) active.run('#'+viewId+'-body');
}

function editDonnee(id){
  const d=id?state.donnees.find(x=>x.id===id):{nom:'',ordre:state.donnees.length+1,histSysteme:'',histTable:'',cibleTable:'',proprietaire:'',responsableId:null,champs:[]};

    corps:`<div class="grid2"><label class="f"><span>Nom de la donnée</span><input type="text" id="o_n" value="${esc(d.nom)}" placeholder="Ex. Articles"></label>
      <label class="f"><span>Ordre</span><input type="number" id="o_o" value="${d.ordre}" min="1"></label></div>
      <div class="grid2"><label class="f"><span>Système maître (historique)</span><input type="text" id="o_hs" value="${esc(d.histSysteme||'')}" list="sysnames2"><datalist id="sysnames2">${[...new Set(state.systemes.map(s=>s.nom))].map(n=>`<option>${esc(n)}</option>`).join('')}</datalist></label>
      <label class="f"><span>Table source (historique)</span><input type="text" id="o_ht" value="${esc(d.histTable||'')}"></label></div>
      <div class="grid2"><label class="f"><span>Table cible</span><input type="text" id="o_ct" value="${esc(d.cibleTable||'')}"></label>
      <label class="f"><span>Propriétaire de la table cible</span><input type="text" id="o_pr" value="${esc(d.proprietaire||'')}"></label></div>
      <label class="f"><span>Responsable de la donnée</span><select id="o_r">${optActeurs(d.responsableId)}</select></label>
      ${id?`<p class="hint">Modifié le ${fmtDT(d.maj)}</p>`:''}`,
    onOk(r){ const nom=$('#o_n',r).value.trim(); if(!nom){toast('Indiquez un nom.');return false;}
      const o={nom,ordre:Number($('#o_o',r).value)||1,histSysteme:$('#o_hs',r).value.trim(),histTable:$('#o_ht',r).value.trim(),
        cibleTable:$('#o_ct',r).value.trim(),proprietaire:$('#o_pr',r).value.trim(),responsableId:$('#o_r',r).value||null,maj:nowStamp()};
      const isNew=!id;

      if(isNew) selDonnee=target.id;
      commitEntity('donnees', target, isNew, isNew?'Objet ajouté':'Objet modifié');
      return false; }});
}
function editChamp(objId,id){
  const d=state.donnees.find(x=>x.id===objId);
  const c=id?d.champs.find(x=>x.id===id):{nom:'',systemeMaitre:'',listeValeur:'',commentaire:''};
  modal({titre:id?'Modifier le champ':'Nouveau champ',extra:id?'<button class="btn btn--danger left" id="ch_del">Supprimer</button>':'',
    corps:`<label class="f"><span>Nom du champ</span><input type="text" id="c_n" value="${esc(c.nom)}" placeholder="Ex. Code article"></label>
      <div class="grid2"><label class="f"><span>Système maître</span><input type="text" id="c_sm" value="${esc(c.systemeMaitre||'')}" list="sysnames3"><datalist id="sysnames3">${[...new Set(state.systemes.map(s=>s.nom))].map(n=>`<option>${esc(n)}</option>`).join('')}</datalist></label>
      <label class="f"><span>Liste de valeurs</span><input type="text" id="c_lv" value="${esc(c.listeValeur||'')}" placeholder="Ex. Actif / Bloqué"></label></div>
      <label class="f"><span>Commentaire sur la signification</span><textarea id="c_co">${esc(c.commentaire||'')}</textarea></label>
      ${id?`<p class="hint">Modifié le ${fmtDT(c.maj)}</p>`:''}`,
    onOk(r){ const nom=$('#c_n',r).value.trim(); if(!nom){toast('Indiquez un nom.');return false;}
      const o={nom,systemeMaitre:$('#c_sm',r).value.trim(),listeValeur:$('#c_lv',r).value.trim(),commentaire:$('#c_co',r).value.trim(),maj:nowStamp()};
      const champs = id ? d.champs.map(x=>x.id===id?Object.assign({},x,o):x) : [...d.champs, Object.assign({id:uid('ch')},o)];
      const target = Object.assign({}, d, {champs, maj:nowStamp()});
      commitEntity('donnees', target, false, id?'Champ modifié':'Champ ajouté');
      return false; }});
  if(id) $('#ch_del').onclick=()=>{ const target=Object.assign({}, d, {champs:d.champs.filter(x=>x.id!==id), maj:nowStamp()}); commitEntity('donnees', target, false, 'Champ supprimé'); };
}

function seedCampagnes(A,don){
  const ns=nowStamp();
  const dId=nom=>{ const o=(don||[]).find(d=>d.nom===nom); return o?o.id:null; };
  const et=(l,att,st)=>({id:uid('et'),libelle:l,attenduTechnique:att,statut:st||'na'});
  const t=(o)=>({id:uid('ts'),maj:ns,statut:'na',responsableId:null,critique:false,attenduTechnique:'',etapes:[],...o});
  return [{id:uid('cp'),nom:'Campagne de test 1',objectif:'Valider les processus critiques Finance et Achats sur le paramétrage initial.',
    debut:'2027-06-01',fin:'2027-07-15',statut:'na',maj:ns,creeLe:today(),
    tests:[
      t({ref:'T-001',titre:'Comptabilisation d\'une facture fournisseur',critique:true,responsableId:A(7),attenduTechnique:'PAR-FIN-01',donneeId:dId('Fournisseurs'),
        etapes:[et('Saisir la facture','Écran de saisie paramétré','na'),et('Contrôler le rapprochement','WF-02','na'),et('Vérifier l\'écriture comptable','PAR-FIN-01','na')]}),
      t({ref:'T-002',titre:'Émission d\'un paiement fournisseur',critique:true,responsableId:A(7),attenduTechnique:'ITF-01',donneeId:dId('Soldes et écritures comptables'),
        etapes:[et('Sélectionner les factures à payer','','na'),et('Générer le fichier de paiement','Interface bancaire ITF-01','na')]}),
      t({ref:'T-003',titre:'Création d\'une commande d\'achat',critique:true,responsableId:A(8),attenduTechnique:'WF-01',donneeId:dId('Commandes d\'achat'),
        etapes:[et('Créer la demande d\'achat','WF-01','na'),et('Valider et transformer en commande','','na')]}),
      t({ref:'T-004',titre:'Réception partielle et service fait',critique:false,responsableId:A(8),attenduTechnique:'ITF-03',donneeId:dId('Articles'),
        etapes:[et('Réceptionner en entrepôt','Interface WMS ITF-03','na')]})
    ]}];
}
let selCampagne=null;
function renderVUnit(){
  subtabView('view-vunit','vunit',[
    {id:'strat',nom:'Stratégie de tests',run:m=>{
      $(m).innerHTML=`<div class="card"><div class="card__head"><h2>Stratégie et orientation des tests</h2><button class="btn" id="st_ed">Modifier</button></div>
        <div class="card__body"><div class="charte">${esc(state.testStrategie.texte).replace(/\n/g,'<br>')}</div>
        <p class="hint" style="margin:12px 0 0">Modifiée le ${fmtDT(state.testStrategie.maj)}</p></div></div>`;
      $('#st_ed').onclick=()=>modal({titre:'Stratégie de tests',
        corps:`<label class="f"><span>Orientation (tests en masse, critiques vs non critiques…)</span><textarea id="st_t" style="min-height:240px">${esc(state.testStrategie.texte)}</textarea></label>`,
        onOk(r){ state.testStrategie=Object.assign({}, state.testStrategie, {texte:$('#st_t',r).value,maj:nowStamp()}); persistSingleton('testStrategie'); toast('Stratégie mise à jour'); }});
    }},
    {id:'patri',nom:'Patrimoine & campagnes',run:m=>renderPatrimoine(m)}
  ]);
}
function renderPatrimoine(m){
  if(!state.campagnes.length){ selCampagne=null; }
  else if(!selCampagne || !state.campagnes.some(c=>c.id===selCampagne)) selCampagne=state.campagnes[0].id;
  const totTests=state.campagnes.reduce((s,c)=>s+c.tests.length,0);
  const okTests=state.campagnes.reduce((s,c)=>s+c.tests.filter(t=>t.statut==='fait').length,0);
  const camp=state.campagnes.find(c=>c.id===selCampagne);
  const chips=state.campagnes.map(c=>{const done=c.tests.filter(t=>t.statut==='fait').length;
    return `<button class="camp${c.id===selCampagne?' is-active':''}" data-cp="${c.id}">
      <span class="camp__n">${esc(c.nom)}</span><span class="camp__m mono">${done}/${c.tests.length}</span></button>`;}).join('');
  $(m).innerHTML=`<div class="kpis">
      <div class="kpi"><div class="kpi__k">Campagnes</div><div class="kpi__v">${state.campagnes.length}</div><div class="kpi__n">${totTests} tests au total</div></div>
      <div class="kpi"><div class="kpi__k">Tests passés</div><div class="kpi__v">${okTests}</div><div class="kpi__n">${totTests?Math.round(okTests/totTests*100):0} % du patrimoine</div></div>
      <div class="kpi"><div class="kpi__k">Tests critiques</div><div class="kpi__v">${state.campagnes.reduce((s,c)=>s+c.tests.filter(t=>t.critique).length,0)}</div><div class="kpi__n">à sécuriser en priorité</div></div>
    </div>
    <div class="card"><div class="card__body" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 14px">
      <div class="camps">${chips||'<span class="muted">Aucune campagne.</span>'}</div>
      <button class="btn btn--primary" id="cp_add" style="margin-left:auto">Nouvelle campagne de tests</button></div></div>
    ${camp?`<div class="card"><div class="card__head"><h2>${esc(camp.nom)}</h2>
        <span class="section__count">${camp.debut?fmtFR(camp.debut)+' → '+fmtFR(camp.fin):''}</span>
        <button class="btn btn--sm btn--ghost" id="cp_ed">Modifier la campagne</button>
        <button class="btn btn--sm btn--ghost btn--danger" id="cp_del">Supprimer</button>
        <button class="btn btn--sm" id="ts_csv">CSV</button>
        <button class="btn btn--primary btn--sm" id="ts_add">Ajouter un test</button></div>
      <div class="card__body" style="padding-top:10px"><p class="hint" style="margin:0 0 4px">${esc(camp.objectif||'')}</p></div>
      <table class="tbl"><thead><tr><th style="width:70px">N°</th><th>Test</th><th style="width:64px">Crit.</th>
        <th style="width:90px">Étapes</th><th style="width:140px">Élément technique</th><th style="width:130px">Donnée</th><th>Responsable</th>
        <th style="width:112px">Statut</th><th style="width:118px">Modifié le</th><th style="width:40px"></th></tr></thead>
      <tbody>${camp.tests.map(t=>`<tr>
        <td class="mono">${esc(t.ref||'')}</td><td><strong>${esc(t.titre)}</strong></td>
        <td>${t.critique?'<span class="tag tag--late">Oui</span>':'<span class="tag tag--todo">Non</span>'}</td>
        <td class="mono">${t.etapes.filter(e=>e.statut==='fait').length}/${t.etapes.length}</td>
        <td class="mono muted">${esc(t.attenduTechnique||'—')}</td>
        <td>${(()=>{const d=(state.donnees||[]).find(x=>x.id===t.donneeId);return d?`<span class="tag tag--ref">${esc(d.nom)}</span>`:'<span class="muted">—</span>';})()}</td>
        <td>${esc(acteurNom(t.responsableId))}</td>
        <td><span class="tag ${statutDef(t.statut).cls}">${statutDef(t.statut).nom}</span></td>
        <td class="mono muted" style="font-size:10.5px">${fmtDT(t.maj)}</td>
        <td><button class="btn btn--sm btn--ghost" data-ts="${t.id}">✎</button></td></tr>`).join('')
        ||'<tr><td colspan="10" class="muted" style="padding:14px">Aucun test dans cette campagne.</td></tr>'}</tbody></table></div>`:''}`;
  $(m).querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{selCampagne=b.dataset.cp;renderPatrimoine(m);});
  $('#cp_add').onclick=()=>editCampagne(null);
  if(camp){
    $('#cp_ed').onclick=()=>editCampagne(camp.id);
    $('#cp_del').onclick=()=>{ if(confirm('Supprimer cette campagne et ses tests ?')){ selCampagne=null; deleteEntity('campagnes', camp.id, 'Campagne supprimée'); } };
    $('#ts_add').onclick=()=>editTest(camp.id,null);
    $('#ts_csv').onclick=()=>downloadCSV('tests_'+camp.nom,['N°','Test','Critique','Étape','Élément technique attendu','Statut étape','Responsable','Statut test'],
      camp.tests.flatMap(t=>t.etapes.length?t.etapes.map((e,i)=>[t.ref,t.titre,t.critique?'Oui':'Non',e.libelle,e.attenduTechnique,statutDef(e.statut).nom,acteurNom(t.responsableId),statutDef(t.statut).nom]):[[t.ref,t.titre,t.critique?'Oui':'Non','','','',acteurNom(t.responsableId),statutDef(t.statut).nom]]));
    $(m).querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>editTest(camp.id,b.dataset.ts));
  }
}

let tmpEtapes=[];

        <tbody id="etbody">${drawEt()}</tbody></table>
        <button class="btn btn--sm" id="et_add" style="margin-top:6px">Ajouter une étape</button></div>
      ${id?`<p class="hint">Modifié le ${fmtDT(t.maj)}</p>`:''}`,
    onOk(r){ const titre=$('#x_t',r).value.trim(); if(!titre){toast('Indiquez l\'intitulé.');return false;}

  const bind=()=>{
    $('#et_add').onclick=()=>{ syncEt($('#modalRoot')); tmpEtapes.push({id:uid('et'),libelle:'',attenduTechnique:'',statut:'na'}); $('#etbody').innerHTML=drawEt(); bind(); };
    $('#modalRoot').querySelectorAll('[data-erm]').forEach(b=>b.onclick=()=>{ syncEt($('#modalRoot')); tmpEtapes.splice(Number(b.dataset.erm),1); $('#etbody').innerHTML=drawEt(); bind(); });
  };
  bind();
  if(id) $('#ts_del').onclick=()=>{ const target=Object.assign({}, camp, {tests:camp.tests.filter(x=>x.id!==id), maj:nowStamp()}); commitEntity('campagnes', target, false, 'Test supprimé'); };
}
function syncEt(r){ tmpEtapes.forEach((e,i)=>{ const l=$(`[data-el="${i}"]`,r),a=$(`[data-ea="${i}"]`,r),s=$(`[data-es="${i}"]`,r);
  if(l)e.libelle=l.value; if(a)e.attenduTechnique=a.value; if(s)e.statut=s.value; }); }

/* ============================================================
   VALIDATION COMPLÈTE — bout-en-bout et planification
   ============================================================ */
function renderVComplete(){
  subtabView('view-vcomplete','vcomplete',[
    {id:'liste',nom:'Liste des bout-en-bout',run:m=>renderRegister(REG.boutEnBout,m)},
    {id:'plan',nom:'Planification',run:m=>{
      const rows=state.boutEnBout.slice().sort((a,b)=>(a.debut||'').localeCompare(b.debut||''))
        .map(b=>({nom:(b.ref?b.ref+' · ':'')+b.nom,debut:b.debut,fin:b.fin,statut:b.statut,resp:acteurNom(b.responsableId).split(' ')[0]}));
      $(m).innerHTML=`<p class="hint">Planning des scénarios de bout-en-bout. Les dates se règlent dans l'onglet « Liste des bout-en-bout ».</p>`+
        miniGantt([{titre:'Scénarios bout-en-bout',couleur:'#DB6B12',rows}]);
    }}
  ]);
}

/* ============================================================
   PRÉPARATION BASCULE
   ============================================================ */
function basculeNom(b){ const o=(state.donnees||[]).find(d=>d.id===b.donneeId); return o?o.nom:(b.typeDonnee||'Non rattaché'); }
function renderBascule(){
  const groups={};
  state.bascule.forEach(b=>{ const key=basculeNom(b); (groups[key]=groups[key]||{titre:key,couleur:'#0E86AD',rows:[]});
    groups[key].rows.push({nom:b.action,debut:b.debut,fin:b.fin,statut:b.statut,resp:acteurNom(b.responsableId).split(' ')[0]}); });
  $('#view-bascule').innerHTML=`<p class="hint">Pour chaque type de données, les actions de reprise sont planifiées ci-dessous. Le détail est éditable dans le tableau.</p>
    <div id="bs_gantt">${Object.keys(groups).length?miniGantt(Object.values(groups)):''}</div>
    <div id="bs_mount"></div>`;
  renderRegister(REG.bascule,'#bs_mount');
}
function renderRepetitions(){
  const cur=subtabState['rep']||'Répétition 1';
  subtabView('view-repetitions','rep',['Répétition 1','Répétition 2','Répétition générale'].map(s=>({
    id:s,nom:s,run:m=>{
      const rows=state.repetitions.filter(r=>r.serie===s).sort((a,b)=>(a.debut||'').localeCompare(b.debut||''))
        .map(r=>({nom:r.action+(r.typeDonnee&&r.typeDonnee!=='—'?' ('+r.typeDonnee+')':''),debut:r.debut,fin:r.fin,statut:r.statut,resp:acteurNom(r.responsableId).split(' ')[0]}));
      $(m).innerHTML=(rows.length?miniGantt([{titre:s,couleur:'#6B3FD4',rows}]):'')+'<div id="rep_mount"></div>';
      renderRegister(REG.repetitions,'#rep_mount',{filter:r=>r.serie===s,addDefaults:{serie:s}});
    }
  })));
}
function renderPlanBascule(){ renderRegister(REG.planBascule,'#view-planbascule'); }

async function renderUsersCard(){
  const mount=$('#ad_users'); if(!mount) return;
  const admin=DB.role()==='admin';
  let profs=[];
  try{ profs=await DB.listProfiles(); }
  catch(e){ mount.innerHTML='<div class="card"><div class="card__body muted">Comptes utilisateurs : lecture impossible.</div></div>'; return; }
  const acteurDe=mail=>{ const m=(mail||'').toLowerCase();
    const a=state.acteurs.find(x=>(x.authEmail||'').toLowerCase()===m)||state.acteurs.find(x=>(x.email||'').toLowerCase()===m);
    return a? (a.prenom+' '+a.nom) : '—'; };
  mount.innerHTML=`<div class="card"><div class="card__head"><h2>Utilisateurs et rôles</h2>
      <span class="section__count">${profs.length} comptes</span></div>
    <table class="tbl"><thead><tr><th>Compte</th><th>Acteur projet associé</th><th style="width:160px">Rôle</th></tr></thead>
    <tbody>${profs.map(pr=>`<tr>
      <td class="mono" style="font-size:12px">${esc(pr.email||pr.user_id)}</td>
      <td>${esc(acteurDe(pr.email))}</td>
      <td>${admin?`<select data-role-uid="${pr.user_id}" style="width:140px">
          ${['lecteur','editeur','admin'].map(r=>`<option ${pr.role===r?'selected':''}>${r}</option>`).join('')}</select>`
        :`<span class="tag">${esc(pr.role)}</span>`}</td></tr>`).join('')}</tbody></table>
    <div class="card__body"><p class="hint" style="margin:0">Les comptes se créent dans la console Supabase (Authentication → Invite user). L'association à un acteur se fait par l'adresse e-mail de sa fiche. ${admin?'Le changement de rôle est immédiat.':''}</p></div></div>`;
  if(admin) mount.querySelectorAll('[data-role-uid]').forEach(sel=>{
    sel.onchange=async ()=>{
      try{ await DB.setRole(sel.dataset.roleUid, sel.value); toast('Rôle mis à jour'); }
      catch(e){ toast('Échec de la mise à jour du rôle.'); renderUsersCard(); }
    };
  });
}
function showFatal(e){
  const msg = e && (e.message||e.code) ? (e.message||e.code) : String(e);
  let root=document.getElementById('authRoot'); if(!root){ root=document.createElement('div'); root.id='authRoot'; document.body.appendChild(root); }
  root.innerHTML=`<div class="auth-card"><h1>Erreur au chargement</h1>
    <div class="auth-err">${esc(msg)}</div>
    <p class="auth-sub">Ouvrez la console (F12) pour le détail, corrigez, puis rechargez.</p>
    <button class="btn" id="fatalReload">Recharger</button></div>`;
  const b=document.getElementById('fatalReload'); if(b) b.onclick=()=>location.reload();
}
function monActeurId(){
  if(PERSIST.mode!=='cloud') return null;
  const u=DB.currentUser(); if(!u||!u.email) return null;
  const mail=u.email.toLowerCase();
  const a=state.acteurs.find(x=>(x.authEmail||'').toLowerCase()===mail) ||
          state.acteurs.find(x=>(x.email||'').toLowerCase()===mail);
  return a? a.id : null;
}
async function startApp(){
  try{
    await loadState();
    const me=monActeurId(); if(me && typeof tdbScope!=='undefined') tdbScope.acteurId=me;
    ensureViews(); buildNav(); initIO(); go('dashboard'); applyRoleUI();
  }catch(e){ console.error('Amorçage interrompu :', e); showFatal(e); }
}
async function boot(){
  if(cloudEnabled()){
    try{ await DB.init(); }catch(e){ console.error(e); }
    if(!DB.currentUser()){ showLogin(); return; }
  }
  startApp();
}
boot();
</script>
